    <style>
      :root {
        --bg: #f6f4ef;
        --surface: #fffdf8;
        --surface2: #efeadf;
        --ink: #262119;
        --muted: #6f675a;
        --faint: #9a9184;
        --accent: #7c2d3e;
        --accent-ink: #ffffff;
        --line: #ddd5c6;
        --hl: #f3e3b3;
        --word-hover: #f1e9d8;
        --shadow: 0 8px 40px rgba(38, 30, 15, 0.25);
        --ws: 1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16171b;
          --surface: #1f2026;
          --surface2: #26272e;
          --ink: #e9e3d6;
          --muted: #a79d8b;
          --faint: #7d7668;
          --accent: #d29a5b;
          --accent-ink: #1c1710;
          --line: #34353d;
          --hl: #54461d;
          --word-hover: #2b2a26;
          --shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Gentium Book Plus", Georgia, "Times New Roman", serif;
        font-size: 17px;
        line-height: 1.5;
      }
      a { color: var(--accent); }
      button { font-family: inherit; }

      .topbar {
        position: sticky; top: 0; z-index: 55;
        display: flex; align-items: center; gap: 0.75rem;
        padding: 0.55rem 0.9rem;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .home-link {
        text-decoration: none; font-weight: 700; color: var(--ink);
        border: 1px solid var(--line); border-radius: 999px;
        padding: 0.28rem 0.8rem; background: var(--surface2);
        white-space: nowrap;
      }
      .topbar .brand { font-variant: small-caps; letter-spacing: 0.04em; color: var(--muted); font-size: 0.98rem; }
      .topbar .spacer { flex: 1; }
      .books-btn {
        text-decoration: none; font-weight: 700; color: var(--accent);
        border: 1px solid var(--accent); border-radius: 999px;
        padding: 0.28rem 0.75rem; background: var(--surface2);
        white-space: nowrap;
      }
      @media (max-width: 620px) {
        .topbar { flex-wrap: wrap; }
        .topbar .brand { display: none; }
      }

      main { max-width: 860px; margin: 0 auto; padding: 1rem 1rem 4rem; }
      h1 { font-size: 1.9rem; line-height: 1.2; margin: 0.6rem 0 0.4rem; }
      h2 { font-size: 1.3rem; margin: 1.6rem 0 0.5rem; }
      p.lede { font-size: 1.1rem; color: var(--ink); }
      .muted { color: var(--muted); }
      .small { font-size: 0.88rem; }

      .card {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: 10px; padding: 1rem 1.1rem; margin: 0.9rem 0;
      }
      .book-cards { display: grid; gap: 0.9rem; grid-template-columns: 1fr; }
      @media (min-width: 640px) { .book-cards { grid-template-columns: 1fr 1fr; } }
      .book-card { display: block; text-decoration: none; color: var(--ink); }
      .book-card:hover { border-color: var(--accent); }
      .book-card .bk-name { font-size: 1.45rem; font-weight: 700; }
      .book-card .bk-lang { color: var(--accent); font-variant: small-caps; letter-spacing: 0.05em; }
      .book-card .bk-stats { color: var(--muted); font-size: 0.92rem; margin-top: 0.3rem; }
      .book-card .bk-sample { margin-top: 0.55rem; font-size: 1.25rem; }
      .heb { font-family: "Noto Serif Hebrew", "Gentium Book Plus", serif; }

      .chap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 0.45rem; margin: 1rem 0; }
      .chap-grid a {
        text-align: center; text-decoration: none; color: var(--ink);
        background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
        padding: 0.55rem 0; font-size: 1.05rem;
      }
      .chap-grid a:hover { border-color: var(--accent); color: var(--accent); }

      /* ------- reader ------- */
      .reader-bar {
        position: sticky; top: 49px; z-index: 20;
        background: var(--bg);
        padding: 0.5rem 0 0.6rem;
        border-bottom: 1px solid var(--line);
        display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center;
      }
      .reader-bar .title { font-size: 1.25rem; font-weight: 700; margin-right: 0.4rem; }
      .ctl {
        border: 1px solid var(--line); background: var(--surface); color: var(--ink);
        border-radius: 999px; padding: 0.3rem 0.75rem; font-size: 0.92rem; cursor: pointer;
        text-decoration: none; display: inline-block;
      }
      .ctl[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
      .ctl.nav { font-weight: 700; }
      .reader-note { color: var(--muted); font-size: 0.92rem; margin: 0.7rem 0 0; }

      .verse { padding: 0.85rem 0 0.95rem; border-bottom: 1px solid var(--line); border-radius: 6px; }
      .verse.flash { animation: flash 2.2s ease-out; }
      @keyframes flash { 0% { background: var(--hl); } 100% { background: transparent; } }
      .verse-ref { font-variant: small-caps; letter-spacing: 0.05em; color: var(--accent); font-size: 0.92rem; margin-bottom: 0.3rem; }
      .verse-ref .webref { color: var(--faint); font-variant: normal; letter-spacing: 0; }
      .words { display: flex; flex-wrap: wrap; gap: 0.35rem 0.15rem; }
      .words.rtl { direction: rtl; text-align: right; }
      .wu {
        display: inline-flex; flex-direction: column; align-items: center;
        border: 0; background: transparent; color: var(--ink); cursor: pointer;
        padding: 0.28rem 0.34rem 0.2rem; border-radius: 7px; text-align: center;
        min-width: 0;
      }
      .wu:hover, .wu:focus-visible { background: var(--word-hover); outline: none; }
      .wu.hl { background: var(--hl); }
      .wu .orig { font-size: calc(1.42rem * var(--ws)); line-height: 1.25; }
      .wu .orig.grk { font-family: "Gentium Book Plus", serif; }
      .wu .orig.heb { font-family: "Noto Serif Hebrew", serif; font-size: calc(1.5rem * var(--ws)); }
      .wu .tr { font-size: calc(0.74rem * var(--ws)); color: var(--faint); font-style: italic; line-height: 1.2; }
      .wu .gl { font-size: calc(0.84rem * var(--ws)); color: var(--muted); line-height: 1.25; }
      body.hide-tr .wu .tr { display: none; }
      body.hide-gl .wu .gl { display: none; }
      .web-line { margin-top: 0.45rem; color: var(--ink); font-size: calc(1rem * var(--ws)); }
      .web-line .web-tag {
        font-variant: small-caps; letter-spacing: 0.05em; color: var(--faint);
        font-size: 0.78rem; margin-right: 0.45rem; white-space: nowrap;
      }

      .chapter-foot { display: flex; justify-content: space-between; gap: 0.6rem; margin-top: 1.4rem; flex-wrap: wrap; }

      /* ------- word sheet ------- */
      .backdrop {
        position: fixed; inset: 0; background: rgba(10, 8, 4, 0.45);
        opacity: 0; pointer-events: none; transition: opacity 0.18s; z-index: 40;
      }
      .backdrop.open { opacity: 1; pointer-events: auto; }
      .sheet {
        position: fixed; z-index: 50; background: var(--surface); color: var(--ink);
        left: 0; right: 0; bottom: 0; max-height: 86vh; overflow-y: auto;
        border-radius: 16px 16px 0 0; box-shadow: var(--shadow);
        transform: translateY(102%); transition: transform 0.22s ease-out;
        padding: 1rem 1.1rem 1.6rem;
      }
      .sheet.open { transform: translateY(0); }
      @media (min-width: 900px) {
        .sheet {
          left: auto; top: 53px; bottom: 0; width: 430px; max-height: none;
          border-radius: 0; transform: translateX(102%);
        }
        .sheet.open { transform: translateX(0); }
      }
      .sheet .close {
        float: right; border: 1px solid var(--line); background: var(--surface2);
        border-radius: 999px; width: 2.1rem; height: 2.1rem; font-size: 1.05rem; cursor: pointer; color: var(--ink);
      }
      .sheet .s-ref { color: var(--accent); font-variant: small-caps; letter-spacing: 0.05em; font-size: 0.9rem; }
      .sheet .s-word { font-size: 2.1rem; line-height: 1.2; margin: 0.15rem 0 0; }
      .sheet .s-word.heb { font-family: "Noto Serif Hebrew", serif; }
      .sheet .s-trans { color: var(--muted); font-style: italic; }
      .sheet h3 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--faint); margin: 1.05rem 0 0.3rem; }
      .sheet p { margin: 0.25rem 0; }
      .sheet .lemma-line { font-size: 1.15rem; }
      .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.3rem; }
      .chip {
        border: 1px solid var(--line); background: var(--surface2); border-radius: 999px;
        padding: 0.14rem 0.6rem; font-size: 0.9rem;
      }
      .occ-list { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.3rem; }
      .occ {
        border: 1px solid var(--line); background: var(--surface); color: var(--accent);
        border-radius: 7px; padding: 0.16rem 0.5rem; font-size: 0.9rem; cursor: pointer;
      }
      .rel-item { margin: 0.3rem 0; }
      .rel-item button { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 1rem; padding: 0; text-decoration: underline; }
      .kbd-note { background: var(--surface2); border-radius: 8px; padding: 0.6rem 0.8rem; }

      /* ------- pronunciation ------- */
      .wu .spk {
        font-size: 0.8rem; line-height: 1; opacity: 0.55; margin-top: 0.08rem;
        min-width: 30px; min-height: 28px; padding: 0.3rem 0.32rem;
        display: inline-flex; align-items: center; justify-content: center;
        border-radius: 6px; cursor: pointer; position: relative; z-index: 2;
        touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      }
      .wu:hover .spk, .wu:focus-visible .spk { opacity: 0.9; }
      .wu .spk.off { opacity: 0.22; cursor: default; }
      .hear-row { display: flex; flex-wrap: wrap; gap: 0.45rem; margin: 0.75rem 0 0.25rem; }
      .hear-btn {
        border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
        border-radius: 999px; padding: 0.42rem 0.95rem; font-size: 0.98rem; cursor: pointer;
      }
      .hear-btn.small {
        background: var(--surface); color: var(--accent); border-color: var(--line);
        padding: 0.42rem 0.8rem; font-size: 0.92rem;
      }

      /* ------- word search ------- */
      .top-search { display: flex; gap: 0.35rem; align-items: center; }
      .top-search input {
        width: 8.2rem; padding: 0.3rem 0.65rem; border-radius: 999px;
        border: 1px solid var(--line); background: var(--surface2); color: var(--ink);
        font-family: inherit; font-size: 0.92rem;
      }
      .top-search button {
        font-weight: 700; color: var(--accent); border: 1px solid var(--accent);
        border-radius: 999px; padding: 0.28rem 0.7rem; background: var(--surface2);
        cursor: pointer; white-space: nowrap; font-size: 0.92rem;
      }
      @media (max-width: 620px) { .top-search input { width: 6.8rem; } }
      .search-form { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.65rem 0 0.3rem; }
      .search-form input {
        flex: 1 1 210px; padding: 0.55rem 0.85rem; font-size: 1.05rem; font-family: inherit;
        border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink);
      }
      .search-form button {
        border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
        border-radius: 999px; padding: 0.55rem 1.1rem; font-size: 1rem; cursor: pointer; font-weight: 700;
      }
      .result-word { font-size: 1.65rem; line-height: 1.25; }
      .result-word.heb { font-family: "Noto Serif Hebrew", serif; }
      .result-meta { color: var(--muted); margin-top: 0.15rem; }
      .noentry {
        display: inline-block; border: 1px solid var(--line); background: var(--surface2);
        border-radius: 999px; padding: 0.12rem 0.6rem; font-size: 0.85rem; color: var(--muted);
      }

      /* ------- update check ------- */
      .upd-btn {
        border: 1px solid var(--line); background: var(--surface2); color: var(--ink);
        border-radius: 999px; padding: 0.28rem 0.75rem; font-size: 0.92rem; cursor: pointer;
        white-space: nowrap;
      }
      #upd-toast, #spk-note {
        position: fixed; left: 50%; bottom: 1.1rem; transform: translateX(-50%) translateY(8px);
        background: var(--ink); color: var(--bg); border-radius: 999px;
        padding: 0.5rem 1rem; font-size: 0.95rem; z-index: 60; max-width: 92vw; text-align: center;
        opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
      }
      #upd-toast.show, #spk-note.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      .sources p { margin: 0.55rem 0; }
      .sources .src-name { font-weight: 700; }
      footer { color: var(--faint); font-size: 0.88rem; margin-top: 2.2rem; }
      .edition { color: var(--muted); font-size: 0.95rem; }
    </style>

      /* ================= occurrence indexes (counted from this app's data) ================= */
      var occGrk = null, occHebByBook = {};
      function greekOcc() {
        if (occGrk) return occGrk;
        occGrk = {};
        BOOKS.forEach(function (b) {
          if (b.lang !== "grc") return;
          b.chapters.forEach(function (chap, ci) {
            chap.forEach(function (v) {
              v.w.forEach(function (w) {
                (occGrk[w[1]] = occGrk[w[1]] || []).push([b.id, ci + 1, v.v]);
              });
            });
          });
        });
        return occGrk;
      }
      function hebrewOcc(bookId) {
        if (occHebByBook[bookId]) return occHebByBook[bookId];
        var book = BOOKMAP[bookId];
        var occ = {};
        book.chapters.forEach(function (chap, ci) {
          chap.forEach(function (v) {
            v.w.forEach(function (w) {
              var key = stripCantillation(w[0]);
              (occ[key] = occ[key] || []).push([ci + 1, v.v]);
            });
          });
        });
        occHebByBook[bookId] = occ;
        return occ;
      }
      function dedupeRefs(refs) {
        var seen = {}, out = [];
        refs.forEach(function (r) { var k = r.join(":"); if (!seen[k]) { seen[k] = 1; out.push(r); } });
        return out;
      }

      /* ================= word search =================
         The index is built at runtime, on first use, from the book data and
         the two lexicons already loaded — no data file is re-shaped.
         Greek matching is accent-insensitive, by dictionary word (lemma)
         and by written form. Hebrew matching strips cantillation and vowel
         points with the same helpers the panels use. Hebrew dictionary-word
         occurrences are aggregated across ALL the Hebrew and Aramaic books
         in this app (the word panels list them one book at a time; search
         lifts that limit). */
      function normGrk(s) {
        return String(s || "").normalize("NFD")
          .replace(/[̀-ͯ]/g, "")
          .toLowerCase().replace(/ς/g, "σ")
          .replace(/[^α-ω]/g, "");
      }
      function normHeb(s) {
        return String(s || "")
          .replace(/[֑-ֽֿׁׂ׀־׃׀]/g, "")
          .replace(/ך/g, "כ").replace(/ם/g, "מ").replace(/ן/g, "נ").replace(/ף/g, "פ").replace(/ץ/g, "צ")
          .replace(/[^א-ת]/g, "");
      }
      function normLat(s) {
        return String(s || "").normalize("NFD")
          .replace(/[̀-ͯ]/g, "")
          .toLowerCase()
          .replace(/[ʼ'’`ʾʿ]/g, "")
          .replace(/[^a-z0-9]+/g, " ")
          .replace(/\s+/g, " ").trim();
      }
      function engVariants(nq) {
        var out = [nq];
        if (/ed$/.test(nq)) { out.push(nq.slice(0, -2)); out.push(nq.slice(0, -1)); out.push(nq.slice(0, -2) + "e"); }
        if (/ing$/.test(nq)) { out.push(nq.slice(0, -3)); out.push(nq.slice(0, -3) + "e"); }
        if (/s$/.test(nq) && nq.length > 3) out.push(nq.slice(0, -1));
        if (/es$/.test(nq)) out.push(nq.slice(0, -2));
        return out;
      }
      function engHit(nq, text) {
        var nt = normLat(text);
        if (!nt) return false;
        var vars = engVariants(nq);
        if (vars.indexOf(nt) >= 0) return true;
        /* token match, stemmed both ways: "love" meets "loved", and
           "created" meets "create" */
        var toks = nt.split(" ");
        for (var i = 0; i < toks.length; i++) {
          if (vars.indexOf(toks[i]) >= 0) return true;
          var tv = engVariants(toks[i]);
          for (var j = 0; j < vars.length; j++) { if (tv.indexOf(vars[j]) >= 0) return true; }
        }
        return false;
      }

      var searchIdx = null;
      function buildSearchIndex() {
        if (searchIdx) return searchIdx;
        var idx = { grkForms: {}, hebFormStrong: {}, hebFused: {}, hebLemmaAll: {}, grkGlossTop: {}, hebGlossTop: {} };
        function topGloss(map, strong, gloss) {
          var g = normLat(gloss);
          if (!g) return;
          var m = map[strong] = map[strong] || {};
          m[g] = (m[g] || 0) + 1;
        }
        function finishTopGloss(map) {
          Object.keys(map).forEach(function (s) {
            var best = "", bn = -1;
            Object.keys(map[s]).forEach(function (g) { if (map[s][g] > bn) { bn = map[s][g]; best = g; } });
            map[s] = best;
          });
        }
        BOOKS.forEach(function (b) {
          if (b.lang === "grc") {
            b.chapters.forEach(function (chap) {
              chap.forEach(function (v) {
                v.w.forEach(function (w) {
                  var k = normGrk(w[0]);
                  if (!k) return;
                  var set = idx.grkForms[k] = idx.grkForms[k] || {};
                  set[w[1]] = 1;
                  topGloss(idx.grkGlossTop, w[1], w[3] || "");
                });
              });
            });
          } else {
            b.chapters.forEach(function (chap, ci) {
              chap.forEach(function (v) {
                v.w.forEach(function (w) {
                  var tag = hebTagFor(b.id, ci + 1, v.v, w[0]);
                  if (tag && tag.n) {
                    (idx.hebLemmaAll[tag.n] = idx.hebLemmaAll[tag.n] || []).push([b.id, ci + 1, v.v]);
                    topGloss(idx.hebGlossTop, tag.n, hebTranslation(tag, w[0]));
                    var sk = normHeb(w[0]);
                    if (sk) { var st = idx.hebFormStrong[sk] = idx.hebFormStrong[sk] || {}; st[tag.n] = 1; }
                  } else if (tag) {
                    /* a written form with a tagging but no Strong's number of
                       its own — a fused form (preposition + pronoun, and its
                       kin). It stays findable by its written form and its
                       gloss, and is shown as a form, never given a link. */
                    var sk2 = normHeb(w[0]);
                    if (!sk2) return;
                    var key = sk2 + "|" + normLat(hebTranslation(tag, w[0]));
                    var fe = idx.hebFused[key];
                    if (!fe) {
                      fe = idx.hebFused[key] = { form: w[0], gloss: hebTranslation(tag, w[0]), parsing: tag.p || "", pieces: tag.s || [], refs: [] };
                    }
                    fe.refs.push([b.id, ci + 1, v.v]);
                  }
                });
              });
            });
          }
        });
        finishTopGloss(idx.grkGlossTop);
        finishTopGloss(idx.hebGlossTop);
        searchIdx = idx;
        return idx;
      }
      function hebrewLemmaOccAll() { return buildSearchIndex().hebLemmaAll; }

      function doSearch(raw) {
        var q = String(raw || "").trim();
        if (!q) return [];
        var idx = buildSearchIndex();
        var results = [], seen = {};
        function addGrk(strong, score) {
          var k = "g" + strong;
          if (seen[k]) { if (score > seen[k].score) seen[k].score = score; return; }
          var r = { type: "grk", strong: strong, score: score };
          seen[k] = r; results.push(r);
        }
        function addHeb(strong, score) {
          var k = "h" + strong;
          if (seen[k]) { if (score > seen[k].score) seen[k].score = score; return; }
          var r = { type: "heb", strong: strong, score: score };
          seen[k] = r; results.push(r);
        }
        function addForm(key, score) {
          var k = "f" + key;
          if (seen[k]) return;
          var r = { type: "form", key: key, score: score };
          seen[k] = r; results.push(r);
        }
        /* (d) a Strong's number typed directly: G3056, H1254, or a bare number */
        var sm = q.match(/^([GgHh])\s*0*(\d{1,5})$/);
        if (sm) {
          var num = parseInt(sm[2], 10);
          if (sm[1].toUpperCase() === "G" && LEX[String(num)]) addGrk(num, 1000);
          if (sm[1].toUpperCase() === "H" && LEXHEB[String(num)]) addHeb(num, 1000);
          return results;
        }
        if (/^\d{1,5}$/.test(q)) {
          var bn = parseInt(q, 10);
          if (LEX[String(bn)]) addGrk(bn, 1000);
          if (LEXHEB[String(bn)]) addHeb(bn, 1000);
          return results;
        }
        var hasGrk = /[Ͱ-Ͽἀ-῿]/.test(q);
        var hasHeb = /[֐-׿]/.test(q);
        if (hasGrk) {
          var nq = normGrk(q);
          if (nq) {
            Object.keys(LEX).forEach(function (k) {
              if (normGrk(LEX[k].l) === nq) addGrk(parseInt(k, 10), 100);
            });
            var fs = idx.grkForms[nq];
            if (fs) Object.keys(fs).forEach(function (s) { addGrk(parseInt(s, 10), 90); });
            if (!results.length && nq.length >= 2) {
              Object.keys(LEX).forEach(function (k) {
                if (normGrk(LEX[k].l).indexOf(nq) === 0) addGrk(parseInt(k, 10), 40);
              });
            }
          }
          return sortSearchResults(results);
        }
        if (hasHeb) {
          var nh = normHeb(q);
          if (nh) {
            Object.keys(LEXHEB).forEach(function (k) {
              if (normHeb(LEXHEB[k].l) === nh) addHeb(parseInt(k, 10), 100);
            });
            var hs = idx.hebFormStrong[nh];
            if (hs) Object.keys(hs).forEach(function (s) { addHeb(parseInt(s, 10), 90); });
            Object.keys(idx.hebFused).forEach(function (key) {
              if (key.split("|")[0] === nh) addForm(key, 95);
            });
            if (!results.length && nh.length >= 2) {
              Object.keys(LEXHEB).forEach(function (k) {
                if (normHeb(LEXHEB[k].l).indexOf(nh) === 0) addHeb(parseInt(k, 10), 40);
              });
            }
          }
          return sortSearchResults(results);
        }
        /* Latin letters: a transliteration, or an English word or gloss */
        var nl = normLat(q);
        if (!nl) return [];
        var gOcc = greekOcc();
        Object.keys(LEX).forEach(function (k) {
          var e = LEX[k], strong = parseInt(k, 10);
          if (!(gOcc[strong] || []).length) return; /* search finds words that occur in this app */
          var score = 0;
          if (normLat(e.t) === nl || normLat(grcTranslit(e.l)) === nl) score = 100;
          else if (nl.length >= 3 && (normLat(e.t).indexOf(nl) === 0 || normLat(grcTranslit(e.l)).indexOf(nl) === 0)) score = 40;
          (e.g || []).forEach(function (r) {
            if (normLat(r) === nl) score = Math.max(score, 90);
            else if (engHit(nl, r)) score = Math.max(score, 80);
          });
          /* the English this app itself most often gives the word in its
             verses is its primary sense here — it outranks a stray
             rendering buried in Strong's list */
          var gt = idx.grkGlossTop[strong];
          if (gt && (gt === nl || engHit(nl, gt))) score = Math.max(score, 95);
          if (!score && engHit(nl, e.d || "")) score = 30;
          if (score) addGrk(strong, score);
        });
        var hOcc = idx.hebLemmaAll;
        Object.keys(LEXHEB).forEach(function (k) {
          var e = LEXHEB[k], strong = parseInt(k, 10);
          if (!(hOcc[strong] || []).length) return;
          var score = 0;
          if (normLat(e.t) === nl || normLat(hebTranslit(e.l)) === nl) score = 100;
          else if (nl.length >= 3 && (normLat(e.t).indexOf(nl) === 0 || normLat(hebTranslit(e.l)).indexOf(nl) === 0)) score = 40;
          (e.k || []).forEach(function (r) {
            if (normLat(r) === nl) score = Math.max(score, 90);
            else if (engHit(nl, r)) score = Math.max(score, 80);
          });
          var ht = idx.hebGlossTop[strong];
          if (ht && (ht === nl || engHit(nl, ht))) score = Math.max(score, 95);
          if (!score && engHit(nl, e.d || "")) score = 30;
          if (!score && (e.b || []).some(function (s) { return engHit(nl, s); })) score = 25;
          if (score) addHeb(strong, score);
        });
        Object.keys(idx.hebFused).forEach(function (key) {
          var fe = idx.hebFused[key];
          if (normLat(fe.gloss) === nl || normLat(fe.gloss.replace(/-/g, " ")) === nl || normLat(hebTranslit(fe.form)) === nl) addForm(key, 85);
          else if (engHit(nl, fe.gloss.replace(/-/g, " "))) addForm(key, 70);
        });
        return sortSearchResults(results).slice(0, 40);
      }
      function searchOccCount(r) {
        if (r.type === "grk") return (greekOcc()[r.strong] || []).length;
        if (r.type === "heb") return (hebrewLemmaOccAll()[r.strong] || []).length;
        var fe = buildSearchIndex().hebFused[r.key];
        return fe ? fe.refs.length : 0;
      }
      function sortSearchResults(results) {
        return results.sort(function (a, b) {
          if (b.score !== a.score) return b.score - a.score;
          return searchOccCount(b) - searchOccCount(a);
        });
      }
      function occByBookHTML(refsAll, strong) {
        var html = "";
        BOOKS.forEach(function (bk) {
          var refs = refsAll.filter(function (r) { return r[0] === bk.id; });
          if (!refs.length) return;
          var pairs = dedupeRefs(refs.map(function (r) { return [r[1], r[2]]; }));
          html += "<h3>Occurrences in " + esc(bk.name) + "</h3>";
          html += "<p>This word appears <strong>" + refs.length + "</strong> time" + (refs.length === 1 ? "" : "s") + " in " + esc(bk.name) + " (counted from the text in this app).</p>";
          html += '<div class="occ-list">' + occButtons(bk.id, pairs, strong) + "</div>";
        });
        return html;
      }
      function searchFormHTML(idSuffix, q) {
        return '<form class="search-form" id="search-form-' + idSuffix + '" role="search">' +
          '<input type="search" id="search-q-' + idSuffix + '" placeholder="Try λόγος, logos, love, bara, or H1254" aria-label="Search for a word" value="' + esc(q || "") + '" />' +
          '<button type="submit">Search</button></form>' +
          '<p class="small muted">Searches the sixty-six books in this app. Type a word in Greek or Hebrew letters (accents and vowel points optional), a transliteration like <em>logos</em> or <em>bara</em>, an English word like <em>love</em>, or a Strong\'s number like <em>G3056</em> or <em>H1254</em>, then press Enter or tap Search.</p>';
      }
      function wireSearchForm(idSuffix) {
        var f = document.getElementById("search-form-" + idSuffix);
        if (!f) return;
        f.addEventListener("submit", function (ev) {
          ev.preventDefault();
          goSearch(document.getElementById("search-q-" + idSuffix).value);
        });
      }
      function goSearch(q) {
        q = String(q || "").trim();
        if (!q) return;
        var target = "#/search/" + encodeURIComponent(q);
        if (location.hash === target) render();
        else location.hash = target;
      }
      function wirePageOccButtons() {
        view.querySelectorAll(".occ").forEach(function (btn) {
          btn.addEventListener("click", function () {
            pendingHl = {
              book: btn.getAttribute("data-book"),
              ch: parseInt(btn.getAttribute("data-ch"), 10),
              v: parseInt(btn.getAttribute("data-v"), 10),
              strong: btn.getAttribute("data-strong") ? parseInt(btn.getAttribute("data-strong"), 10) : null
            };
            location.hash = "#/" + pendingHl.book + "/" + pendingHl.ch;
            if (current.book === pendingHl.book && current.ch === pendingHl.ch) render();
          });
        });
      }
      function renderSearch(query) {
        closeSheet();
        var results = doSearch(query);
        var html = "<h1>Word search</h1>" + searchFormHTML("page", query);
        if (!query) {
          html += '<div class="card"><p style="margin:0">Type a word above and press Enter or tap Search.</p></div>';
        } else if (!results.length) {
          html += '<div class="card"><p style="margin:0">No word matching “' + esc(query) + '” was found in the sixty-six books in this app. Try a transliteration (like <em>logos</em> or <em>bara</em>), the word in Greek or Hebrew letters, or a Strong\'s number (like <em>G3056</em> or <em>H1254</em>).</p></div>';
        } else {
          var gOcc = greekOcc(), idx = buildSearchIndex();
          html += '<p class="muted">' + results.length + " result" + (results.length === 1 ? "" : "s") + ' for “' + esc(query) + '” — occurrence counts are counted from the text in this app. Tap a reference to jump to the verse with the word highlighted; tap “Open word study” for the full dictionary panel.</p>';
          results.forEach(function (r) {
            html += '<div class="card">';
            if (r.type === "grk") {
              var e = LEX[String(r.strong)];
              var refs = gOcc[r.strong] || [];
              html += '<div class="result-word">' + esc(e.l) + '</div>' +
                '<div class="result-meta">' + esc(e.t) + ' · <strong>Strong\'s G' + r.strong + '</strong> · Greek</div>' +
                (e.d ? "<p>" + esc(shortDef(e.d)) + "</p>" : (GRK_DEF_SUPP[r.strong] ? "<p>" + esc(shortDef(GRK_DEF_SUPP[r.strong])) + "</p>" : "")) +
                "<p>Appears <strong>" + refs.length + "</strong> time" + (refs.length === 1 ? "" : "s") + " in this app, counted from the text in this app.</p>" +
                '<p><button class="ctl nav" type="button" data-open-grk="' + r.strong + '">Open word study — ' + esc(e.l) + "</button></p>" +
                occByBookHTML(refs.map(function (x) { return x; }), r.strong);
            } else if (r.type === "heb") {
              var he = LEXHEB[String(r.strong)];
              var hrefs = idx.hebLemmaAll[r.strong] || [];
              html += '<div class="result-word heb" dir="rtl" style="text-align:right">' + esc(he.l) + '</div>' +
                '<div class="result-meta">' + esc(he.t) + ' · <strong>Strong\'s H' + r.strong + '</strong> · Hebrew</div>' +
                (he.d ? "<p>" + esc(shortDef(he.d)) + "</p>" : "") +
                "<p>Appears <strong>" + hrefs.length + "</strong> time" + (hrefs.length === 1 ? "" : "s") + " in this app, counted from the text in this app — across every Hebrew and Aramaic book in the app.</p>" +
                '<p><button class="ctl nav" type="button" data-open-heb="' + r.strong + '">Open word study — <span class="heb">' + esc(he.l) + "</span></button></p>" +
                occByBookHTML(hrefs, r.strong);
            } else {
              var fe = idx.hebFused[r.key];
              html += '<div class="result-word heb" dir="rtl" style="text-align:right">' + esc(fe.form) + '</div>' +
                '<div class="result-meta">' + esc(hebTranslit(fe.form)) + ' · Hebrew · <span class="noentry">No dictionary entry of its own</span></div>' +
                '<p class="lemma-line"><strong>' + esc(fe.gloss ? fe.gloss.replace(/-/g, " ") : "") + "</strong></p>" +
                "<p>This written form has <strong>no separate dictionary entry of its own</strong> in Strong's — it is a word written as one in the text (for example, a preposition carrying its own pronoun ending), so it is shown here as the form itself, with its gloss and parsing, rather than linked to a dictionary word that does not belong to it." + (fe.parsing ? " Parsing: " + esc(fe.parsing) + "." : "") + "</p>" +
                "<p>Appears <strong>" + fe.refs.length + "</strong> time" + (fe.refs.length === 1 ? "" : "s") + " in this app, counted from the text in this app.</p>" +
                occByBookHTML(fe.refs, null);
            }
            html += "</div>";
          });
        }
        view.innerHTML = html;
        wireSearchForm("page");
        view.querySelectorAll("[data-open-grk]").forEach(function (btn) {
          btn.addEventListener("click", function () { openGreekLemma(parseInt(btn.getAttribute("data-open-grk"), 10)); });
        });
        view.querySelectorAll("[data-open-heb]").forEach(function (btn) {
          btn.addEventListener("click", function () { openHebrewLemma(parseInt(btn.getAttribute("data-open-heb"), 10), null, "Hebrew"); });
        });
        wirePageOccButtons();
        window.scrollTo(0, 0);
      }

      /* ================= Hebrew tagging (this app's own, from BDB + Strong's) ================= */
      function hebKey(word) {
        /* accent marks, meteg, paseq and the grapheme joiner do not change the word's identity */
        return stripCantillation(word).replace(/[ֽ׀͏]/g, "");
      }
      function hebTagFor(bookId, ch, v, word) {
        var tags = HEBTAGS_BY_BOOK[bookId] || {};
        var key = hebKey(word);
        return tags["occ|" + ch + "|" + v + "|" + key] || tags[key] || null;
      }
      var occHebLemmaByBook = {};
      function hebrewLemmaOcc(bookId) {
        if (occHebLemmaByBook[bookId]) return occHebLemmaByBook[bookId];
        var book = BOOKMAP[bookId];
        var occ = {};
        book.chapters.forEach(function (chap, ci) {
          chap.forEach(function (v) {
            v.w.forEach(function (w) {
              var t = hebTagFor(bookId, ci + 1, v.v, w[0]);
              if (t && t.n) (occ[t.n] = occ[t.n] || []).push([ci + 1, v.v]);
            });
          });
        });
        occHebLemmaByBook[bookId] = occ;
        return occ;
      }
      function hebrewCoverage(book) {
        var total = 0, glossed = 0, lemma = 0, parsed = 0;
        book.chapters.forEach(function (chap, ci) {
          chap.forEach(function (v) {
            v.w.forEach(function (w) {
              total++;
              var t = hebTagFor(book.id, ci + 1, v.v, w[0]);
              if (t) {
                if (t.g) glossed++;
                if (t.n) lemma++;
                if (t.p) parsed++;
              }
            });
          });
        });
        return { total: total, glossed: glossed, lemma: lemma, parsed: parsed, pending: total - glossed };
      }

      /* === word-study core: translations, synonyms, related words ===
         The translation in this verse for every word is this app's own
         editorial work: derived token by token from the word's gloss, its
         parsing, and the WEB verse as context control. English synonyms are
         ordinary near-equivalents written here — never copied from any
         modern thesaurus. Related words are shown only where Strong's own
         derivation / compare fields (public domain, 1890), already in the
         lexicon data above, support the relation. */

      function capFirst(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
      function lowFirst(s) { return s ? s.charAt(0).toLowerCase() + s.slice(1) : s; }

      /* ---------- Greek verb paradigms ---------- */
      var IRREG_VERB = {
        "say": ["said", "said", "says", "saying"], "come": ["came", "come", "comes", "coming"], "commit": ["committed", "committed", "commits", "committing"],
        "go": ["went", "gone", "goes", "going"], "give": ["gave", "given", "gives", "giving"],
        "see": ["saw", "seen", "sees", "seeing"], "know": ["knew", "known", "knows", "knowing"],
        "do": ["did", "done", "does", "doing"], "have": ["had", "had", "has", "having"],
        "be": ["was", "been", "is", "being"], "become": ["became", "become", "becomes", "becoming"],
        "take": ["took", "taken", "takes", "taking"], "make": ["made", "made", "makes", "making"],
        "write": ["wrote", "written", "writes", "writing"], "hear": ["heard", "heard", "hears", "hearing"],
        "speak": ["spoke", "spoken", "speaks", "speaking"], "send": ["sent", "sent", "sends", "sending"],
        "find": ["found", "found", "finds", "finding"], "eat": ["ate", "eaten", "eats", "eating"],
        "drink": ["drank", "drunk", "drinks", "drinking"], "arise": ["arose", "arisen", "arises", "arising"],
        "rise": ["rose", "risen", "rises", "rising"], "stand": ["stood", "stood", "stands", "standing"],

the WEB\'s verse numbers, with every Hebrew word placed in the WEB verse it belongs to, and chapters 20, 21, 23, and 24 say so at their heads. 1 Kings has seams of the same kind: its chapter 4 runs only to verse 20 — the Hebrew\'s 5:1–14 stands here as the WEB\'s 4:21–34, and its 5:15–32 as chapter 5 — and at the end of chapter 22 the Hebrew counts the closing sentence of the WEB\'s 22:43 as its own verse 44, so its 22:45–54 stands here as 22:44–53. 1 Kings in this app keeps the WEB\'s verse numbers, with every Hebrew word placed in the WEB verse it belongs to, and chapters 4, 5, and 22 say so at their heads. 2 Kings has one seam of the same kind: the Hebrew counts the verse the WEB prints as 11:21 — “Jehoash was seven years old when he began to reign” — as the first verse of its chapter 12, so its chapter 11 runs only to verse 20 and its 12:2–22 stands here as 12:1–21. 2 Kings in this app keeps the WEB\'s verse numbers, with every Hebrew word placed in the WEB verse it belongs to, and chapters 11 and 12 say so at their heads. 1 Chronicles has seams of the same kind: the Hebrew\'s 5:27–41 stands here as 6:1–15, and its chapter 6 as 6:16–81; and within chapter 12 its verses 4 and 5 together make the WEB\'s verse 4, so its 12:6–41 stands here as 12:5–40. 1 Chronicles in this app keeps the WEB\'s verse numbers, with every Hebrew word placed in the WEB verse it belongs to, and chapters 5, 6, and 12 say so at their heads. 2 Chronicles has two seams of the same kind: the Hebrew counts the verse the WEB prints as 2:1 as its 1:18, so its chapter 2 stands here as 2:2–18; and it counts the WEB\'s 14:1 as its 13:23, so its chapter 14 stands here as 14:2–15. 2 Chronicles in this app keeps the WEB\'s verse numbers, with every Hebrew word placed in the WEB verse it belongs to, and chapters 1, 2, 13, and 14 say so at their heads. Ezra has no numbering seam — its Hebrew and the WEB agree verse for verse — but it is written in two languages: its Aramaic passages (4:8–6:18 and 7:12–2 's 6:13 as its 7:1, so its chapter 7 runs one verse ahead of the WEB\'s — its 7:2–14 stands here as 7:1–13. The Song in this app keeps the WEB\'s verse numbers, with every Hebrew word placed in the WEB verse it belongs to, and chapters 6 and 7 say so at their heads. Isaiah has two seams of its own: the Hebrew\'s 8:23 is the WEB\'s 9:1, so its chapter 9 runs one verse behind the WEB\'s, and the Hebrew counts the WEB\'s 64:1 as the end of 63:19, so its chapter 64 runs one verse behind too. Isaiah in this app keeps the WEB\'s verse numbers, with every Hebrew word placed in the WEB verse it belongs to, and chapters 9 and 64 say so at their heads. Jeremiah has one seam of the same kind: the Hebrew\'s 8:23 is the WEB\'s 9:1, so its chapter 9 runs one verse behind the WEB\'s. Jeremiah in this app keeps the WEB\'s verse numbers, with every Hebrew word placed in the WEB verse it belongs to, and chapters 8 and 9 say so at their heads. One verse of Jeremiah is not Hebrew at all: 10:11 is written in Aramaic, a sentence to be spoken to the nations in a tongue they know; its words are tagged and labeled as Aramaic in their panels, and chapter 10 says so at its head. Ezekiel has one seam of the same kind between chapters 20 and 21: the Hebrew\'s 21:1–5 stands here as the WEB\'s 20:45–49, and its 21:6–37 as the WEB\'s 21:1–32. Ezekiel in this app keeps the WEB\'s verse numbers, with every Hebrew word placed in the WEB verse it belongs to, and chapters 20 and 21 say so at their heads. Daniel has seams of its own between chapters 3 and 6: the Hebrew text\'s 3:31–33 is the WEB\'s 4:1–3, its chapter 4 is the WEB\'s 4:4–37, its 6:1 is the WEB\'s 5:31, and its 6:2–29 is the WEB\'s 6:1–28. Daniel in this app keeps the WEB\'s verse numbers, with every word placed in the WEB verse it belongs to, and chapters 3, 4, 5, and 6 say so at their heads. Daniel is also written in two languages — Hebrew in chapters 1, 2:1–4a, and 8–12, Aramaic from 2:4b through 7:28 — and every Aramaic word is labeled Aramaic in its panel, with Aramaic parsing. Hosea has three seams of the same kind: its chapter 2 has 25 verses where the WEB\'s has 23 — the verses the WEB prints as 1:10–2:1 are the Hebrew\'s 2:1–3, so its 2:3–25 stands here as 2:1–23 — its 12:1 stands here as 11:12, so its chapter 12 runs one verse behind the WEB\'s, and its 14:1 stands here as 13:16, so its chapter 14 runs one verse behind too. Hosea in this app keeps the WEB\'s verse numbers, with every Hebrew word placed in the WEB verse it belongs to, and chapters 1, 2, 11, 12, 13, and 14 say so at their heads. Joel has seams of the same kind: the Hebrew counts Joel as four chapters, not three — its 3:1–5 stands here as the WEB\'s 2:28–32, and its chapter 4 as the WEB\'s chapter 3. Joel in this app keeps the WEB\'s verse numbers, with every Hebrew word placed in the WEB verse it belongs to, and chapters 2 and 3 say so at their heads. Amos has no numbering seam — its Hebrew and the WEB agree verse for verse. Obadiah has no numbering seam either — its Hebrew and the WEB agree verse for verse. Jonah has one too: Hebrew Jonah 2:1 is English Jonah 1:17, and Hebrew chapter 2 runs one verse ahead of English Bibles through that chapter (Hebrew 2:2–11 is English 2:1–10). Affected verses are labeled with their World English Bible reference so the two never get mixed up. Micah has one seam of the same kind between chapters 4 and 5: the Hebrew\'s 4:14 stands here as the WEB\'s 5:1, and its chapter 5 runs one verse behind the WEB\'s — its 5:1–14 stands here as the WEB\'s 5:2–15. Micah in this app keeps the WEB\'s verse numbers, with every Hebrew word placed in the WEB verse it belongs to, and chapters 4 and 5 say so at their heads. Nahum has one seam of the same kind between chapters 1 and 2: the Hebrew\'s chapter 1 runs only to verse 14 — the verse the WEB prints as 1:15 is the Hebrew\'s 2:1 — so the Hebrew\'s 2:2–14 stands here as 2:1–13. Nahum in this app keeps the WEB\'s verse numbers, with every Hebrew word placed in the WEB verse it belongs to, and chapters 1 and 2 say so at their heads. Habakkuk has no numbering seam either — its Hebrew and the WEB agree verse for verse. Zephaniah has no numbering seam — its Hebrew and the WEB agree verse for verse. Zechariah has one seam of the same kind between chapters 1 and 2: its chapter 1 runs only to verse 17 — the WEB\'s 1:18–21 is its 2:1–4 — so its chapter 2 runs to 17 verses and stands here as 2:1–13. Zechariah in this app keeps the WEB\'s verse numbers, with every Hebrew word placed in the WEB verse it belongs to, and chapters 1 and 2 say so at their heads. Malachi has one seam of the same kind at its end: the Hebrew counts Malachi as three chapters, not four — the verses the WEB prints as chapter 4 are the Hebrew\'s 3:19–24, the close of its chapter 3. Malachi in this app keeps the WEB\'s verse numbers, with every Hebrew word placed in the WEB verse it belongs to, and chapter 4 says so at its head.</p></div>';

        backdrop.classList.add("open");
        sheet.scrollTop = 0;
      }
      function closeSheet() {
        sheet.classList.remove("open");
        sheet.setAttribute("aria-hidden", "true");
        backdrop.classList.remove("open");
      }
      backdrop.addEventListener("click", closeSheet);
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });

      /* Greek occurrences span the Greek books; refs are [bookId, ch, v]. */
      function greekOccSections(occAll, occ, strong) {
        var html = "";
        BOOKS.filter(function (x) { return x.lang === "grc"; }).forEach(function (bk) {
          var bid = bk.id;
          var total = occAll.filter(function (r) { return r[0] === bid; }).length;
          if (!total) return;
          var pairs = occ.filter(function (r) { return r[0] === bid; }).map(function (r) { return [r[1], r[2]]; });
          html += "<h3>Occurrences in " + BOOKMAP[bid].name + "</h3>";
          html += "<p>This dictionary word appears <strong>" + total + "</strong> time" + (total === 1 ? "" : "s") + " in " + BOOKMAP[bid].name + " (counted from the text in this app).</p>";
          html += '<div class="occ-list">' + occButtons(bid, pairs, strong) + "</div>";
        });
        return html;
      }
      function occButtons(bookId, refs, strong) {
        var max = 90, out = "";
        refs.slice(0, max).forEach(function (r) {
          out += '<button class="occ" data-book="' + bookId + '" data-ch="' + r[0] + '" data-v="' + r[1] + '"' + (strong ? ' data-strong="' + strong + '"' : "") + ">" + r[0] + ":" + r[1] + "</button>";
        });
        if (refs.length > max) out += '<span class="small muted">…and ' + (refs.length - max) + " more</span>";
        return out;
      }
      function wireOccButtons() {
        sheet.querySelectorAll(".occ").forEach(function (btn) {
          btn.addEventListener("click", function () {
            pendingHl = {
              book: btn.getAttribute("data-book"),
              ch: parseInt(btn.getAttribute("data-ch"), 10),
              v: parseInt(btn.getAttribute("data-v"), 10),
              strong: btn.getAttribute("data-strong") ? parseInt(btn.getAttribute("data-strong"), 10) : null
            };
            location.hash = "#/" + pendingHl.book + "/" + pendingHl.ch;
            if (current.book === pendingHl.book && current.ch === pendingHl.ch) render();
          });
        });
      }

      function greekRels(e) {
        return (e.r || []).filter(function (r) {
          var t = LEX[String(r[0])];
          return t && /[ἀ-῿Ͱ-Ͽ]/.test(t.l); /* Greek-script lemmas only */
        });
      }
      /* Thayer's Greek-English Lexicon (1889) — public domain by age; text from the
         Internet Archive scan of the 1889 edition, keyed to Strong's numbers by
         dictionary form (assets/data-thayer.js). Shown only where the scan text
         matched the word's dictionary form with confidence; the count of entries
         carried is computed from that data wherever it is stated. */
      function thayerHTML(strong) {
        var T = window.SB_THAYER || {};
        var t = T[String(strong)];
        if (!t) return "";
        var paras = [t];
        if (t.length > 700) {
          var frags = t.split(/(?=\s\d\.\s)/).map(function (s) { return s.trim(); }).filter(Boolean);
          paras = [];
          frags.forEach(function (f) {
            if (paras.length && f.length < 60) paras[paras.length - 1] += " " + f;
            else paras.push(f);
          });
        }
        var h = "<h3>Definition — Thayer's lexicon (1889)</h3>";
        paras.forEach(function (p) { h += "<p>" + esc(p) + "</p>"; });
        h += '<p class="small muted">Thayer\'s fuller treatment of this word, in his own words (public domain, 1889), lightly re-flowed from the printed page; Strong\'s shorter definition stands above it. The scan\'s occasional misread letter is left as the archive copy gives it. See Sources &amp; credits.</p>';
        return h;
      }

      function openGreekSheet(b, ch, v, w, tokens, wi) {
        var strong = w[1], e = LEX[String(strong)];
        var occAll = greekOcc()[strong] || [];
        var occ = dedupeRefs(occAll);
        var html = '<button class="close" id="sheet-close" aria-label="Close">✕</button>';
        html += '<div class="s-ref">' + esc(b.name) + " " + ch + ":" + v + " · Greek</div>";
        html += '<div class="s-word">' + esc(w[0]) + "</div>";
        html += '<div class="s-trans">' + esc(grcTranslit(w[0])) + "</div>";
        html += hearRowHTML(w[0], "el-GR", e ? e.l : null);
        html += "<h3>Translation in this verse</h3>";
        html += '<p class="lemma-line"><strong>' + esc(grkTranslation(w, tokens, wi)) + "</strong></p>";
        html += '<p class="small muted">The English for this one word in this verse, following the original word by word — not a smooth sentence. The smooth translation is the World English Bible verse under the text. A one-word rendering cannot carry the word\'s whole meaning; the definition and synonyms below carry more of it.</p>';
        if (e) {
          if (e.d) { html += "<h3>Definition — Strong's (1890)</h3><p>" + esc(e.d) + "</p>"; }
          else if (GRK_DEF_SUPP[strong]) { html += "<h3>Definition</h3><p>" + esc(GRK_DEF_SUPP[strong]) + "</p>" + '<p class="small muted">This app\'s own wording: Strong\'s e-text leaves this entry\'s definition field empty — its explanation stands under Word origin below.</p>'; }
          html += thayerHTML(strong);
          html += synonymsHTML(greekSynonyms(w), greekRelated(strong, e), "Greek");
          html += "<h3>Dictionary form</h3>";
          html += '<p class="lemma-line"><strong>' + esc(e.l) + "</strong> · " + esc(e.t) + ' · <span class="muted">Strong\'s G' + strong + "</span></p>";
          html += "<h3>Parsing (Robinson's codes, spelled out)</h3>";
          var dec = w[2].split("|").map(decodeMorph);
          html += "<p>" + esc(dec[0]) + "</p>";
          for (var i = 1; i < dec.length; i++) html += '<p class="muted">Also parsed as: ' + esc(dec[i]) + "</p>";
          html += '<p class="small muted">Code in the source: ' + esc(w[2].replace(/\|/g, " / ")) + "</p>";
          if (e.o) { html += "<h3>Word origin — Strong's</h3><p>" + esc(e.o) + "</p>"; }
          if (e.g && e.g.length) {
            html += "<h3>How the King James Bible renders it (Strong's list)</h3><div class='chips'>" +
              e.g.map(function (g) { return '<span class="chip">' + esc(g) + "</span>"; }).join("") + "</div>";
            html += '<p class="small muted">The word\'s gloss — the starting point for its translation in this verse — is chosen from this list: the rendering the World English Bible uses in this verse, where one matches.</p>';
          }
        } else {
          html += '<p class="muted">No dictionary entry was found for this word in Strong\'s Greek dictionary.</p>';
        }
        html += greekOccSections(occAll, occ, strong);
        openSheet(html);
        document.getElementById("sheet-close").addEventListener("click", closeSheet);
        wireHear(w[0], "el-GR", e ? e.l : null);
        sheet.querySelectorAll("[data-rel]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var n = parseInt(btn.getAttribute("data-rel"), 10);
            openGreekLemma(n);
          });
        });
        wireOccButtons();
      }

      function openGreekLemma(strong) {
        var e = LEX[String(strong)];
        if (!e) return;
        var occAll = greekOcc()[strong] || [];
        var occ = dedupeRefs(occAll);
        var html = '<button class="close" id="sheet-close" aria-label="Close">✕</button>';
        html += '<div class="s-ref">Word study · Greek</div>';
        html += '<div class="s-word">' + esc(e.l) + "</div>";
        html += '<div class="s-trans">' + esc(e.t) + ' · Strong\'s G' + strong + "</div>";
        html += hearRowHTML(e.l, "el-GR", null);
        if (e.d) { html += "<h3>Definition — Strong's (1890)</h3><p>" + esc(e.d) + "</p>"; }
        else if (GRK_DEF_SUPP[strong]) { html += "<h3>Definition</h3><p>" + esc(GRK_DEF_SUPP[strong]) + "</p>" + '<p class="small muted">This app\'s own wording: Strong\'s e-text leaves this entry\'s definition field empty — its explanation stands under Word origin below.</p>'; }
        html += thayerHTML(strong);
        html += synonymsHTML(greekSynonyms([e.l, strong, "", (e.g && e.g[0]) || ""]), greekRelated(strong, e), "Greek");
        if (e.o) { html += "<h3>Word origin — Strong's</h3><p>" + esc(e.o) + "</p>"; }
        if (e.g && e.g.length) {
          html += "<h3>How the King James Bible renders it (Strong's list)</h3><div class='chips'>" +
            e.g.map(function (g) { return '<span class="chip">' + esc(g) + "</span>"; }).join("") + "</div>";
        }
        if (occ.length) {
          html += greekOccSections(occAll, occ, strong);
        } else {
          html += "<h3>Occurrences</h3>";
          html += "<p>This word does not occur in Matthew, Mark, Luke, John, Acts, Romans, 1 Corinthians, 2 Corinthians, Galatians, Ephesians, Philippians, Colossians, 1 Thessalonians, Hebrews, James, 1 Peter, 2 Peter, 1 John, or Revelation; it is here because Strong's dictionary connects it with a word that does.</p>";
        }
        openSheet(html);
        document.getElementById("sheet-close").addEventListener("click", closeSheet);
        wireHear(e.l, "el-GR", null);
        sheet.querySelectorAll("[data-rel]").forEach(function (btn) {
          btn.addEventListener("click", function () { openGreekLemma(parseInt(btn.getAttribute("data-rel"), 10)); });
        });
        wireOccButtons();
      }

      function openHebrewSheet(b, ch, v, w) {
        var key = hebKey(w[0]);
        var tag = hebTagFor(b.id, ch, v, w[0]);
        var occAll = hebrewOcc(b.id)[key] || [];
        var occ = dedupeRefs(occAll);
        var html = '<button class="close" id="sheet-close" aria-label="Close">✕</button>';
        html += '<div class="s-ref">' + esc(b.name) + " " + ch + ":" + v + " · " + ((tag && tag.lang === "arc") ? "Aramaic" : "Hebrew") + "</div>";
        html += '<div class="s-word heb" dir="rtl" style="text-align:right">' + (w[1] ? "־" : "") + esc(w[0]) + "</div>";
        html += '<div class="s-trans">' + esc(hebTranslit(w[0])) + "</div>";
        var hebLemma = (tag && tag.n && LEXHEB[String(tag.n)]) ? LEXHEB[String(tag.n)].l : null;
        html += hearRowHTML(w[0], "he-IL", hebLemma);
        if (w[1]) html += "<p class='muted'>This word is joined to the word before it by a <em>maqqef</em> (the little line ־), read as one phrase.</p>";
        var htr = tag ? hebTranslation(tag, w[0]) : "";
        var he = (tag && tag.n && LEXHEB[String(tag.n)]) ? LEXHEB[String(tag.n)] : null;
        if (htr) {
          html += "<h3>Translation in this verse</h3>";
          html += '<p class="lemma-line"><strong>' + esc(htr) + "</strong></p>";
          html += '<p class="small muted">The English for this one word in this verse, following the original word by word — not a smooth sentence. The smooth translation is the World English Bible verse under the text. A one-word rendering cannot carry the word\'s whole meaning; the definition and synonyms below carry more of it.</p>';
        }
        if (he) {
          if (he.d) { html += "<h3>Definition — Strong's (1890)</h3><p>" + esc(he.d) + "</p>"; }
          if (he.b && he.b.length) {
            html += "<h3>Meaning range — Brown-Driver-Briggs (1906)</h3>";
            he.b.forEach(function (s) { html += "<p>" + esc(s) + "</p>"; });
            html += '<p class="small muted">BDB\'s sense divisions for this entry, in its own words (spelling as printed in 1906).</p>';
          }
          html += synonymsHTML(hebrewSynonyms(tag, htr), hebrewRelated(tag), (tag && tag.lang === "arc") ? "Aramaic" : "Hebrew");
        } else if (tag) {
          html += synonymsHTML(hebrewSynonyms(tag, htr), hebrewRelated(tag), (tag && tag.lang === "arc") ? "Aramaic" : "Hebrew");
        }
        if (tag && tag.s && tag.s.length) {
          html += "<h3>How this word is built</h3>";
          tag.s.forEach(function (s) { html += "<p>" + esc(s) + "</p>"; });
          if (tag.g) html += '<p class="small muted">Piece by piece, the word\'s tagging reads: ' + esc(tag.g) + "</p>";
        }
        if (he) {
          html += "<h3>Dictionary form</h3>";
          html += '<p class="lemma-line"><strong class="heb">' + esc(he.l) + "</strong> · " + esc(he.t) + ' · <span class="muted">Strong\'s H' + tag.n + "</span></p>";
          html += '<p class="rel-item"><button data-heblemma="' + tag.n + '">Open the dictionary entry — <span class="heb">' + esc(he.l) + "</span> · Strong's H" + tag.n + "</button></p>";
          if (tag.p) { html += "<h3>Parsing</h3><p>" + esc(tag.p) + "</p>"; }
          if (he.o) { html += "<h3>Word origin — Strong's</h3><p>" + esc(he.o) + "</p>"; }
          if (he.k && he.k.length) {
            html += "<h3>How the King James Bible renders it (Strong's list)</h3><div class='chips'>" +
              he.k.map(function (g) { return '<span class="chip">' + esc(g) + "</span>"; }).join("") + "</div>";
          }
          var loccAll = hebrewLemmaOcc(b.id)[tag.n] || [];
          var locc = dedupeRefs(loccAll);
          html += "<h3>This dictionary word in " + esc(b.name) + "</h3>";
          html += "<p>Counting every form of it that this app's tagging has identified, it appears <strong>" + loccAll.length + "</strong> time" + (loccAll.length === 1 ? "" : "s") + " in " + esc(b.name) + ".</p>";
          html += '<div class="occ-list">' + occButtons(b.id, locc, tag.n) + "</div>";
        } else if (tag) {
          if (tag.p) { html += "<h3>Parsing</h3><p>" + esc(tag.p) + "</p>"; }
          if (/^Preposition/.test(tag.p || "")) {
            html += '<p class="small muted">This word is a preposition carrying its own pronoun ending (for example, לוֹ, "to him"), written as one word in the original; it has no separate dictionary entry of its own.</p>';
          } else {
            html += '<p class="small muted">This word has no separate entry in Strong\'s ' + ((tag && tag.lang === "arc") ? "" : "Hebrew ") + 'dictionary (1890), so it carries its gloss and parsing here without a dictionary link — rather than borrow one that does not belong to it.</p>';
          }
        } else {
          html += "<h3>About this word</h3>";
          html += '<div class="kbd-note"><p style="margin:0">This word is <strong>still being tagged</strong>. The Hebrew tagging in this app is our own work, built word by word from two public-domain lexicons — Brown-Driver-Briggs (1906) and Strong\'s Hebrew dictionary (1890) — because the ready-made Hebrew taggings are Creative Commons data, and this app is public-domain only. Rather than guess at this word\'s dictionary form, we leave the space empty until it is tagged and checked.</p></div>';
        }
        html += "<h3>This exact form in " + esc(b.name) + "</h3>";
        html += "<p>The same written form (leaving aside the accent marks, which vary with the music of the sentence) appears <strong>" + occAll.length + "</strong> time" + (occAll.length === 1 ? "" : "s") + " in " + esc(b.name) + ", counted from the text in this app.</p>";
        html += '<div class="occ-list">' + occButtons(b.id, occ, null) + "</div>";
        openSheet(html);
        document.getElementById("sheet-close").addEventListener("click", closeSheet);
        wireHear(w[0], "he-IL", hebLemma);
        sheet.querySelectorAll("[data-heblemma], [data-relheb]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var n = parseInt(btn.getAttribute("data-heblemma") || btn.getAttribute("data-relheb"), 10);
            openHebrewLemma(n, b.id, (tag && tag.lang === "arc") ? "Aramaic" : "Hebrew");
          });
        });
        wireOccButtons();
      }

      /* The Hebrew dictionary entry as its own sheet — the same tappable
         destination Greek words have always had. Every linked Hebrew word's
         panel carries an "Open the dictionary entry" button to here,
         including the decomposition links (a preposition piece such as
         מִן, H4480, inside a fused form): the link is present and tappable
         wherever the word's tagging carries a Strong's number with a real
         entry behind it. */
      function openHebrewLemma(strong, bookId, langLabel) {
        var e = LEXHEB[String(strong)];
        if (!e) return;
        var bk = bookId ? BOOKMAP[bookId] : null;
        var label = langLabel || "Hebrew";
        var html = '<button class="close" id="sheet-close" aria-label="Close">✕</button>';
        html += '<div class="s-ref">Word study · ' + esc(label) + "</div>";
        html += '<div class="s-word heb" dir="rtl" style="text-align:right">' + esc(e.l) + "</div>";
        html += '<div class="s-trans">' + esc(e.t) + ' · Strong\'s H' + strong + "</div>";
        html += hearRowHTML(e.l, "he-IL", null);
        if (e.d) { html += "<h3>Definition — Strong's (1890)</h3><p>" + esc(e.d) + "</p>"; }
        if (e.b && e.b.length) {
          html += "<h3>Meaning range — Brown-Driver-Briggs (1906)</h3>";
          e.b.forEach(function (s) { html += "<p>" + esc(s) + "</p>"; });
          html += '<p class="small muted">BDB\'s sense divisions for this entry, in its own words (spelling as printed in 1906).</p>';
        }
        var pseudoTag = { n: strong };
        html += synonymsHTML(hebrewSynonyms(pseudoTag, ""), hebrewRelated(pseudoTag), label);
        if (e.o) { html += "<h3>Word origin — Strong's</h3><p>" + esc(e.o) + "</p>"; }
        if (e.k && e.k.length) {
          html += "<h3>How the King James Bible renders it (Strong's list)</h3><div class='chips'>" +
            e.k.map(function (g) { return '<span class="chip">' + esc(g) + "</span>"; }).join("") + "</div>";
        }
        if (bk) {
          var loccAll = hebrewLemmaOcc(bookId)[strong] || [];
          var locc = dedupeRefs(loccAll);
          html += "<h3>This dictionary word in " + esc(bk.name) + "</h3>";
          if (loccAll.length) {
            html += "<p>Counting every form of it that this app's tagging has identified, it appears <strong>" + loccAll.length + "</strong> time" + (loccAll.length === 1 ? "" : "s") + " in " + esc(bk.name) + ".</p>";
            html += '<div class="occ-list">' + occButtons(bookId, locc, strong) + "</div>";
          } else {
            html += "<p>This dictionary word does not itself occur in " + esc(bk.name) + "; it is here because Strong's dictionary connects it with a word that does.</p>";
          }
        }
        openSheet(html);
        document.getElementById("sheet-close").addEventListener("click", closeSheet);
        wireHear(e.l, "he-IL", null);
        sheet.querySelectorAll("[data-relheb]").forEach(function (btn) {
          btn.addEventListener("click", function () { openHebrewLemma(parseInt(btn.getAttribute("data-relheb"), 10), bookId, label); });
        });
        wireOccButtons();
      }

      /* ================= router ================= */
      var current = { name: "home" };
      function render() {
        closeSheet(); /* any navigation — Books button included — closes an open word panel */
        var h = location.hash.replace(/^#\/?/, "");
        var parts = h.split("/").filter(Boolean);
        document.body.classList.remove("hide-tr", "hide-gl");
        if (parts.length === 0) { current = { name: "home" }; renderHome(); }
        else if (parts[0] === "sources") { current = { name: "home" }; renderHome(); var s = document.getElementById("sources"); if (s) s.scrollIntoView(); }
        else if (parts[0] === "search") {
          current = { name: "search" };
          var sq = parts.slice(1).join("/") || "";
          try { sq = decodeURIComponent(sq); } catch (e) { /* keep the raw text */ }
          renderSearch(sq);
        }
        else if (parts.length === 1 && BOOKMAP[parts[0]]) { current = { name: "book", book: parts[0] }; renderBook(BOOKMAP[parts[0]]); }
        else if (parts.length === 2 && BOOKMAP[parts[0]]) {
          var ch = parseInt(parts[1], 10);
          if (ch >= 1 && ch <= BOOKMAP[parts[0]].chapters.length) {
            current = { name: "chapter", book: parts[0], ch: ch };
            renderChapter(BOOKMAP[parts[0]], ch);
          } else { current = { name: "book", book: parts[0] }; renderBook(BOOKMAP[parts[0]]); }
        } else { current = { name: "home" }; renderHome(); }
      }
      window.addEventListener("hashchange", render);
      render();
    </script>
    <script data-goatcounter="https://jesuslovestyler.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
