    <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Noto+Serif+Hebrew:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f6f4ef;
        --surface: #fffdf8;
        --surface2: #efeadf;
        --ink: #262119;
        --muted: #6f675a;
        --faint: #9a9184;
        --accent: #7c2d3e;
        --accent-ink: #ffffff;
        --line: #ddd5c6;
        --hl: #f3e3b3;
        --word-hover: #f1e9d8;
        --shadow: 0 8px 40px rgba(38, 30, 15, 0.25);
        --ws: 1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16171b;
          --surface: #1f2026;
          --surface2: #26272e;
          --ink: #e9e3d6;
          --muted: #a79d8b;
          --faint: #7d7668;
          --accent: #d29a5b;
          --accent-ink: #1c1710;
          --line: #34353d;
          --hl: #54461d;
          --word-hover: #2b2a26;
          --shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Gentium Book Plus", Georgia, "Times New Roman", serif;
        font-size: 17px;
        line-height: 1.5;
      }
      a { color: var(--accent); }
      button { font-family: inherit; }

      .topbar {
        position: sticky; top: 0; z-index: 55;
        display: flex; align-items: center; gap: 0.75rem;
        padding: 0.55rem 0.9rem;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .home-link {
        text-decoration: none; font-weight: 700; color: var(--ink);
        border: 1px solid var(--line); border-radius: 999px;
        padding: 0.28rem 0.8rem; background: var(--surface2);
        white-space: nowrap;
      }
      .topbar .brand { font-variant: small-caps; letter-spacing: 0.04em; color: var(--muted); font-size: 0.98rem; }
      .topbar .spacer { flex: 1; }
      .books-btn {
        text-decoration: none; font-weight: 700; color: var(--accent);
        border: 1px solid var(--accent); border-radius: 999px;
        padding: 0.28rem 0.75rem; background: var(--surface2);
        white-space: nowrap;
      }
      @media (max-width: 620px) {
        .topbar { flex-wrap: wrap; }
        .topbar .brand { display: none; }
      }

      main { max-width: 860px; margin: 0 auto; padding: 1rem 1rem 4rem; }
      h1 { font-size: 1.9rem; line-height: 1.2; margin: 0.6rem 0 0.4rem; }
      h2 { font-size: 1.3rem; margin: 1.6rem 0 0.5rem; }
      p.lede { font-size: 1.1rem; color: var(--ink); }
      .muted { color: var(--muted); }
      .small { font-size: 0.88rem; }

      .card {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: 10px; padding: 1rem 1.1rem; margin: 0.9rem 0;
      }
      .book-cards { display: grid; gap: 0.9rem; grid-template-columns: 1fr; }
      @media (min-width: 640px) { .book-cards { grid-template-columns: 1fr 1fr; } }
      .book-card { display: block; text-decoration: none; color: var(--ink); }
      .book-card:hover { border-color: var(--accent); }
      .book-card .bk-name { font-size: 1.45rem; font-weight: 700; }
      .book-card .bk-lang { color: var(--accent); font-variant: small-caps; letter-spacing: 0.05em; }
      .book-card .bk-stats { color: var(--muted); font-size: 0.92rem; margin-top: 0.3rem; }
      .book-card .bk-sample { margin-top: 0.55rem; font-size: 1.25rem; }
      .heb { font-family: "Noto Serif Hebrew", "Gentium Book Plus", serif; }

      .chap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 0.45rem; margin: 1rem 0; }
      .chap-grid a {
        text-align: center; text-decoration: none; color: var(--ink);
        background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
        padding: 0.55rem 0; font-size: 1.05rem;
      }
      .chap-grid a:hover { border-color: var(--accent); color: var(--accent); }

      /* ------- reader ------- */
      .reader-bar {
        position: sticky; top: 49px; z-index: 20;
        background: var(--bg);
        padding: 0.5rem 0 0.6rem;
        border-bottom: 1px solid var(--line);
        display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center;
      }
      .reader-bar .title { font-size: 1.25rem; font-weight: 700; margin-right: 0.4rem; }
      .ctl {
        border: 1px solid var(--line); background: var(--surface); color: var(--ink);
        border-radius: 999px; padding: 0.3rem 0.75rem; font-size: 0.92rem; cursor: pointer;
        text-decoration: none; display: inline-block;
      }
      .ctl[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
      .ctl.nav { font-weight: 700; }
      .reader-note { color: var(--muted); font-size: 0.92rem; margin: 0.7rem 0 0; }

      .verse { padding: 0.85rem 0 0.95rem; border-bottom: 1px solid var(--line); border-radius: 6px; }
      .verse.flash { animation: flash 2.2s ease-out; }
      @keyframes flash { 0% { background: var(--hl); } 100% { background: transparent; } }
      .verse-ref { font-variant: small-caps; letter-spacing: 0.05em; color: var(--accent); font-size: 0.92rem; margin-bottom: 0.3rem; }
      .verse-ref .webref { color: var(--faint); font-variant: normal; letter-spacing: 0; }
      .words { display: flex; flex-wrap: wrap; gap: 0.35rem 0.15rem; }
      .words.rtl { direction: rtl; text-align: right; }
      .wu {
        display: inline-flex; flex-direction: column; align-items: center;
        border: 0; background: transparent; color: var(--ink); cursor: pointer;
        padding: 0.28rem 0.34rem 0.2rem; border-radius: 7px; text-align: center;
        min-width: 0;
      }
      .wu:hover, .wu:focus-visible { background: var(--word-hover); outline: none; }
      .wu.hl { background: var(--hl); }
      .wu .orig { font-size: calc(1.42rem * var(--ws)); line-height: 1.25; }
      .wu .orig.grk { font-family: "Gentium Book Plus", serif; }
      .wu .orig.heb { font-family: "Noto Serif Hebrew", serif; font-size: calc(1.5rem * var(--ws)); }
      .wu .tr { font-size: calc(0.74rem * var(--ws)); color: var(--faint); font-style: italic; line-height: 1.2; }
      .wu .gl { font-size: calc(0.84rem * var(--ws)); color: var(--muted); line-height: 1.25; }
      body.hide-tr .wu .tr { display: none; }
      body.hide-gl .wu .gl { display: none; }
      .web-line { margin-top: 0.45rem; color: var(--ink); font-size: calc(1rem * var(--ws)); }
      .web-line .web-tag {
        font-variant: small-caps; letter-spacing: 0.05em; color: var(--faint);
        font-size: 0.78rem; margin-right: 0.45rem; white-space: nowrap;
      }

      .chapter-foot { display: flex; justify-content: space-between; gap: 0.6rem; margin-top: 1.4rem; flex-wrap: wrap; }

      /* ------- word sheet ------- */
      .backdrop {
        position: fixed; inset: 0; background: rgba(10, 8, 4, 0.45);
        opacity: 0; pointer-events: none; transition: opacity 0.18s; z-index: 40;
      }
      .backdrop.open { opacity: 1; pointer-events: auto; }
      .sheet {
        position: fixed; z-index: 50; background: var(--surface); color: var(--ink);
        left: 0; right: 0; bottom: 0; max-height: 86vh; overflow-y: auto;
        border-radius: 16px 16px 0 0; box-shadow: var(--shadow);
        transform: translateY(102%); transition: transform 0.22s ease-out;
        padding: 1rem 1.1rem 1.6rem;
      }
      .sheet.open { transform: translateY(0); }
      @media (min-width: 900px) {
        .sheet {
          left: auto; top: 53px; bottom: 0; width: 430px; max-height: none;
          border-radius: 0; transform: translateX(102%);
        }
        .sheet.open { transform: translateX(0); }
      }
      .sheet .close {
        float: right; border: 1px solid var(--line); background: var(--surface2);
        border-radius: 999px; width: 2.1rem; height: 2.1rem; font-size: 1.05rem; cursor: pointer; color: var(--ink);
      }
      .sheet .s-ref { color: var(--accent); font-variant: small-caps; letter-spacing: 0.05em; font-size: 0.9rem; }
      .sheet .s-word { font-size: 2.1rem; line-height: 1.2; margin: 0.15rem 0 0; }
      .sheet .s-word.heb { font-family: "Noto Serif Hebrew", serif; }
      .sheet .s-trans { color: var(--muted); font-style: italic; }
      .sheet h3 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--faint); margin: 1.05rem 0 0.3rem; }
      .sheet p { margin: 0.25rem 0; }
      .sheet .lemma-line { font-size: 1.15rem; }
      .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.3rem; }
      .chip {
        border: 1px solid var(--line); background: var(--surface2); border-radius: 999px;
        padding: 0.14rem 0.6rem; font-size: 0.9rem;
      }
      .occ-list { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.3rem; }
      .occ {
        border: 1px solid var(--line); background: var(--surface); color: var(--accent);
        border-radius: 7px; padding: 0.16rem 0.5rem; font-size: 0.9rem; cursor: pointer;
      }
      .rel-item { margin: 0.3rem 0; }
      .rel-item button { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 1rem; padding: 0; text-decoration: underline; }
      .kbd-note { background: var(--surface2); border-radius: 8px; padding: 0.6rem 0.8rem; }

      /* ------- pronunciation ------- */
      .wu .spk {
        font-size: 0.8rem; line-height: 1; opacity: 0.55; margin-top: 0.08rem;
        min-width: 30px; min-height: 28px; padding: 0.3rem 0.32rem;
        display: inline-flex; align-items: center; justify-content: center;
        border-radius: 6px; cursor: pointer; position: relative; z-index: 2;
        touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      }
      .wu:hover .spk, .wu:focus-visible .spk { opacity: 0.9; }
      .wu .spk.off { opacity: 0.22; cursor: default; }
      .hear-row { display: flex; flex-wrap: wrap; gap: 0.45rem; margin: 0.75rem 0 0.25rem; }
      .hear-btn {
        border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
        border-radius: 999px; padding: 0.42rem 0.95rem; font-size: 0.98rem; cursor: pointer;
      }
      .hear-btn.small {
        background: var(--surface); color: var(--accent); border-color: var(--line);
        padding: 0.42rem 0.8rem; font-size: 0.92rem;
      }

      /* ------- update check ------- */
      .upd-btn {
        border: 1px solid var(--line); background: var(--surface2); color: var(--ink);
        border-radius: 999px; padding: 0.28rem 0.75rem; font-size: 0.92rem; cursor: pointer;
        white-space: nowrap;
      }
      #upd-toast, #spk-note {
        position: fixed; left: 50%; bottom: 1.1rem; transform: translateX(-50%) translateY(8px);
        background: var(--ink); color: var(--bg); border-radius: 999px;
        padding: 0.5rem 1rem; font-size: 0.95rem; z-index: 60; max-width: 92vw; text-align: center;
        opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
      }
      #upd-toast.show, #spk-note.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      .sources p { margin: 0.55rem 0; }
      .sources .src-name { font-weight: 700; }
      footer { color: var(--faint); font-size: 0.88rem; margin-top: 2.2rem; }
      .edition { color: var(--muted); font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <div class="topbar">
      <a class="home-link" href="https://jesuslovestyler.com/">⌂ Home</a>
      <span class="brand">Study Bible</span>
      <span class="spacer"></span>
      <a class="books-btn" href="#/" aria-label="Back to the books dashboard">📖 Books</a>
      <button class="upd-btn" id="upd-btn-top" type="button">↻ Updates</button>
      <a href="#/sources" style="font-size:0.95rem;">Sources &amp; credits</a>
    </div>

    <main id="view" aria-live="polite"></main>

    <div class="backdrop" id="backdrop"></div>
    <aside class="sheet" id="sheet" aria-hidden="true"></aside>
    <div id="upd-toast" role="status"></div>
    <div id="spk-note" role="status"></div>

    <script src="assets/data-john.js"></script>
    <script src="assets/data-mark.js"></script>
    <script src="assets/data-luke.js"></script>
    <script src="assets/data-genesis.js"></script>
    <script src="assets/data-exodus.js"></script>
    <script src="assets/data-jonah.js"></script>
    <script src="assets/data-lex-greek.js"></script>
    <script src="assets/data-lex-hebrew.js"></script>
    <script src="assets/data-heb-tags.js"></script>
    <script src="assets/data-ex-tags.js"></script>
    <script src="assets/data-jonah-tags.js"></script>
    <script>
      "use strict";
      /* ================= data ================= */
      var BOOKS = [window.SB_GENESIS, window.SB_EXODUS, window.SB_JONAH, window.SB_JOHN, window.SB_MARK, window.SB_LUKE];
      var LEX = window.SB_LEX_GRK || {};
      var LEXHEB = window.SB_LEX_HEB || {};
      /* Each Hebrew book carries its own tagging table: the tagging is our
         own work per book, and occurrence rulings belong to their own book. */
      var HEBTAGS_BY_BOOK = { genesis: window.SB_HEB_TAGS || {}, exodus: window.SB_HEB_TAGS_EX || {}, jonah: window.SB_HEB_TAGS_JONAH || {} };
      var HEBTAGS = HEBTAGS_BY_BOOK.genesis;
      var BOOKMAP = {};
      BOOKS.forEach(function (b) { BOOKMAP[b.id] = b; });

      /* ================= build stamp & update check ================= */
      /* Kept character-for-character identical to the <meta name="app-build"> tag in <head>. */
      var APP_BUILD_STAMP = "2026-10-21.8";
      function runningStamp() {
        var m = document.querySelector('meta[name="app-build"]');
        return (m && m.getAttribute("content")) || APP_BUILD_STAMP;
      }
      var updToastTimer = null;
      function showUpdToast(msg) {
        var t = document.getElementById("upd-toast");
        if (!t) return;
        t.textContent = msg;
        t.classList.add("show");
        if (updToastTimer) clearTimeout(updToastTimer);
        updToastTimer = setTimeout(function () { t.classList.remove("show"); }, 4500);
      }
      var updBusy = false;
      function checkForUpdates(statusEl) {
        if (updBusy) return;
        updBusy = true;
        function setStatus(msg) {
          if (statusEl) statusEl.textContent = msg;
          else showUpdToast(msg);
        }
        setStatus("Checking for updates…");
        var base = location.href.split("#")[0].split("?")[0];
        fetch(base + "?_upd=" + Date.now(), { cache: "no-store" })
          .then(function (r) { return r.text(); })
          .then(function (html) {
            updBusy = false;
            var m = html.match(/<meta[^>]*name=["']app-build["'][^>]*content=["']([^"']+)["']/i) ||
                    html.match(/<meta[^>]*content=["']([^"']+)["'][^>]*name=["']app-build["']/i);
            var fetched = m && m[1];
            if (!fetched) { setStatus("Couldn't check for updates — check your connection and try again."); return; }
            if (fetched === runningStamp()) { setStatus("You're up to date."); return; }
            setStatus("A new version is available — updating…");
            /* Navigate exactly once, to the same page carrying the new stamp as a cache-buster. */
            location.replace(base + "?v=" + encodeURIComponent(fetched));
          })
          .catch(function () {
            updBusy = false;
            setStatus("Couldn't check for updates — check your connection and try again.");
          });
      }

      /* ================= pronunciation (device speech synthesis) ================= */
      var speechOK = ("speechSynthesis" in window) && ("SpeechSynthesisUtterance" in window);
      /* Voices are resolved synchronously, inside the tap handler itself:
         any async gap between the tap and speak() can lose the user
         activation Safari requires before it will make a sound, so
         getVoices() is read fresh at speak time (and warmed up below and
         on voiceschanged), never awaited. */
      function currentVoices() {
        try { return window.speechSynthesis.getVoices() || []; } catch (e) { return []; }
      }
      function pickVoice(lang, vs) {
        vs = vs || currentVoices();
        for (var i = 0; i < vs.length; i++) {
          var vl = (vs[i].lang || "").replace("_", "-");
          if (vl === lang) return vs[i];
        }
        for (var j = 0; j < vs.length; j++) {
          var v2 = (vs[j].lang || "").replace("_", "-");
          if (v2.indexOf(lang.slice(0, 2)) === 0) return vs[j];
        }
        return null;
      }
      /* Strip what belongs to the sentence, not to the word: trailing
         punctuation, the maqqef joiner, zero-width marks. The word's own
         accents and breathings stay — they are part of how it sounds. */
      function speechText(text) {
        if (!text) return "";
        var t = String(text).replace(/[\u200B-\u200D\uFEFF]/g, "");
        t = t.replace(/\s+/g, " ").replace(/^\s+|\s+$/g, "");
        t = t.replace(/[.,;:!?··'’ʼ־׃-]+$/g, "");
        return t.replace(/^\s+|\s+$/g, "");
      }
      var spkNoteTimer = null;
      function showSpkNote(msg) {
        var t = document.getElementById("spk-note");
        if (!t) return;
        t.textContent = msg;
        t.classList.add("show");
        if (spkNoteTimer) clearTimeout(spkNoteTimer);
        spkNoteTimer = setTimeout(function () { t.classList.remove("show"); }, 4200);
      }
      function noVoiceMsg(lang) {
        return lang === "he-IL" ? "No Hebrew voice available on this device"
             : lang === "el-GR" ? "No Greek voice available on this device"
             : "No voice available on this device for this word";
      }
      function speakWord(text, lang, rate, opts) {
        opts = opts || {};
        var clean = speechText(text);
        if (!clean) return;
        if (!speechOK) { showSpkNote("Pronunciation needs a speech voice, and this device doesn't offer one."); return; }
        try {
          var synth = window.speechSynthesis;
          var vs = currentVoices();
          var voice = pickVoice(lang, vs);
          if (vs.length && !voice) showSpkNote(noVoiceMsg(lang));
          /* Cancel only what is actually sounding, and only BEFORE speaking:
             Safari silently swallows an utterance that follows a cancel()
             issued while the synthesizer was idle. */
          if (synth.speaking || synth.pending) synth.cancel();
          try { synth.resume(); } catch (e2) { /* not every engine has one */ }
          var u = new SpeechSynthesisUtterance(clean);
          u.lang = lang;
          u.rate = rate || 0.85;
          if (voice) u.voice = voice;
          u.onerror = function (ev) {
            var err = ev && ev.error;
            if (err === "interrupted" || err === "canceled" || err === "cancelled") return;
            /* A very short word can be dropped by a device voice — a lone
               breathing-marked pronoun is the classic case — so try once
               more with the word's dictionary form, which carries more
               sound (ὃ is retried as ὅς). */
            if (!opts.retried && opts.lemma) {
              var lem = speechText(opts.lemma);
              if (lem && lem !== clean && clean.length <= 3) {
                speakWord(opts.lemma, lang, rate, { retried: true });
                return;
              }
            }
            showSpkNote(noVoiceMsg(lang));
          };
          synth.speak(u);
        } catch (e) { showSpkNote(noVoiceMsg(lang)); }
      }
      if (speechOK) {
        try {
          currentVoices();
          if ("onvoiceschanged" in window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = function () { currentVoices(); };
          }
        } catch (e) { /* ignore */ }
      }
      function hearRowHTML(text, lang, lemmaText) {
        if (!speechOK) {
          return '<p class="small muted">Pronunciation playback uses your device\'s own speech voice, and this device doesn\'t offer one — so the hear buttons are unavailable here.</p>';
        }
        var h = '<div class="hear-row">' +
          '<button class="hear-btn" type="button" data-hear="main">🔊 Hear pronunciation</button>' +
          '<button class="hear-btn small" type="button" data-hear="slow">Slow</button>';
        if (lemmaText && lemmaText !== text) {
          h += '<button class="hear-btn small" type="button" data-hear="lemma">Hear dictionary form</button>';

      function wordStudyCoverage() {
        var total = 0, translated = 0, defined = 0, withSyn = 0, withRel = 0;
        BOOKS.forEach(function (b) {
          if (b.lang === "grc") {
            b.chapters.forEach(function (chap) {
              chap.forEach(function (v) {
                v.w.forEach(function (w, wi) {
                  total++;
                  if (grkTranslation(w, v.w, wi)) translated++;
                  var e = LEX[String(w[1])];
                  if (e && (e.d || GRK_DEF_SUPP[w[1]])) defined++;
                  var s = greekSynonyms(w);
                  if (s) withSyn++;
                  if (greekRelated(w[1], e).length) withRel++;
                });
              });
            });
          } else {
            b.chapters.forEach(function (chap, ci) {
              chap.forEach(function (v) {
                v.w.forEach(function (w) {
                  total++;
                  var tag = hebTagFor(b.id, ci + 1, v.v, w[0]);
                  var tr = tag ? hebTranslation(tag, w[0]) : "";
                  if (tr) translated++;
                  if (tag && ((tag.n && LEXHEB[String(tag.n)] && LEXHEB[String(tag.n)].d) || (tag.s && tag.s.length))) defined++;
                  if (tag) withSyn++;
                  if (hebrewRelated(tag).length) withRel++;
                });
              });
            });
          }
        });
        return { total: total, translated: translated, defined: defined, withSyn: withSyn, withRel: withRel };
      }
      /* === end word-study core === */

          "<p><strong>These word translations follow the original word by word and are NOT a smooth sentence.</strong> They follow the Greek and Hebrew order and shape, one word at a time. The readable translation is the <strong>World English Bible</strong> verse printed beneath every verse, labeled so the two are never confused. And a one-word rendering cannot carry a word's whole meaning — that is what the study panel is for.</p>" +
          "<p><strong>Tap or click any original word</strong> to study it. The panel leads with the word's translation in this verse, then its <strong>definition</strong> (Strong's, and the meaning range in Brown-Driver-Briggs for Hebrew), then <strong>synonyms &amp; related words</strong> — ordinary English near-equivalents for the word's sense in this verse, and original-language words related to it where the public-domain sources support the relation — then how the word is built and parsed, its dictionary form and Strong's number, and everywhere else the word appears in the book.</p>" +

          coverageText() + "</div>" +
          '<div class="card"><h2 style="margin-top:0.2rem">Keeping this copy current</h2>' +
          "<p>New books, tagging, and corrections are added as the work is verified. This copy is build <strong>" + esc(runningStamp()) + "</strong>.</p>" +
          '<p style="margin-bottom:0.2rem"><button class="ctl nav" type="button" id="upd-btn">Check for updates</button> <span id="upd-status" class="small muted" role="status"></span></p></div>' +
          sourcesHTML();
        var updBtn = document.getElementById("upd-btn");
        if (updBtn) updBtn.addEventListener("click", function () {

      }

      function coverageText() {

        var cj = hebrewCoverage(BOOKMAP.jonah);
        var w = wordStudyCoverage();
        function hebPara(name, c) {
          return "<p>Of " + name + "'s " + fmt(c.total) + " Hebrew words, <strong>" + fmt(c.glossed) + "</strong> carry a word tagging and a parsing, and <strong>" + fmt(c.lemma) + "</strong> are linked to their dictionary word and Strong's number. " +
            (c.pending > 0

        }
        return "<p>For the Hebrew books, no ready-made public-domain Hebrew tagging exists (the well-known Hebrew taggings are Creative Commons, and this app uses public-domain data only), so the tagging here is <strong>our own work</strong>, built word by word from Brown-Driver-Briggs (1906) and Strong's Hebrew dictionary (1890).</p>" +

      function sourcesHTML() {
        return '<div class="card sources" id="sources"><h2 style="margin-top:0.2rem">Sources &amp; credits</h2>' +
          "<p>Everything in this app is <strong>public domain</strong>. Each source below names the basis of its status.</p>" +
          '<p><span class="src-name">Greek text, Strong\'s numbers &amp; parsings of John, Mark, and Luke</span> — <em>The New Testament in the Original Greek: Byzantine Textform 2018</em>, compiled by Maurice A. Robinson and William G. Pierpont. Public domain by the editors\' own dedication: the printed editions release all rights in the text to everyone, and the official data repository (github.com/byztxt/byzantine-majority-text), from which this text was taken, is released under the Unlicense.</p>' +
          '<p><span class="src-name">Greek dictionary</span> — <em>Strong\'s Greek Dictionary</em>, James Strong, 1890. Public domain by age. Supplies each word\'s dictionary form, definition, word origin, and the list of King James renderings from which the gloss under each word is chosen. E-text prepared by Ulrik Petersen (openscriptures/strongs).</p>' +
          '<p><span class="src-name">Hebrew text of Genesis, Exodus, and Jonah</span> — the <em>Westminster Leningrad Codex</em>, the electronic text of the Leningrad Codex (written about AD 1008), maintained by the J. Alan Groves Center. Public domain; Genesis\'s text was taken from the CrossWire Bible Society\'s module, which distributes it as public domain, and Exodus\'s and Jonah\'s from the same codex in its Unicode/XML edition (the tanach.us edition, prepared by C. V. Kimball from the Westminster Leningrad Codex) — the editions were checked against each other on Genesis before Exodus and Jonah were built from it.</p>' +
          '<p><span class="src-name">Hebrew dictionary (Strong\'s)</span> — <em>Strong\'s Hebrew Dictionary</em>, James Strong, 1890. Public domain by age. Supplies each Hebrew word\'s dictionary form, transliteration, definition, and King James renderings. E-text from the OpenScriptures Strong\'s collection (github.com/openscriptures/strongs), whose own header declares the work public domain; before use, the e-text was checked entry by entry — all 8,674 entries, H1 to H8674, present and accounted for.</p>' +
          '<p><span class="src-name">Hebrew dictionary (BDB)</span> — <em>A Hebrew and English Lexicon of the Old Testament</em>, Francis Brown, S. R. Driver, and Charles A. Briggs (Brown-Driver-Briggs), Clarendon Press, 1906. Public domain by age. Supplies the meaning range shown in each Hebrew word\'s panel — BDB\'s own sense divisions, drawn from its entry structure. Full text consulted from the public-domain scan at the Internet Archive (item ahebrewandengli00briggoog).</p>' +
          '<p><span class="src-name">Hebrew word tagging of Genesis, Exodus, and Jonah</span> — our own work, made for this app: the segmentation of each word (its prefixes, core, and pronoun endings), the literal gloss under it, and its parsing were built here from the two lexicons above, word by word, and checked against them. No Creative Commons data and no modern tagged-Hebrew dataset was used. Where a word\'s identity could not be settled from those lexicons, it is left untagged rather than guessed; the coverage note above counts those words exactly.</p>' +
          '<p><span class="src-name">English verses</span> — the <em>World English Bible</em>, public domain (eBible.org; translation led by Michael Paul Johnson). The WEB is a complete translation printed under each verse; it is not the source of the word-by-word translations.</p>' +
          '<p><span class="src-name">Word translations &amp; synonyms</span> — our own editorial work, made for this app. Each word\'s translation in its verse was derived from its word tagging, its parsing, and the WEB verse as context control, so a verb reads as the action it performs in the verse. The English synonyms are ordinary near-equivalents written here for each word\'s sense in its verse — not copied from any modern thesaurus or any copyrighted or Creative Commons synonym database. Related Greek and Hebrew words are shown only where Strong\'s own derivation and comparison fields support the relation; where the sources support none, that part is simply omitted.</p>' +
          '<p><span class="src-name">Made here</span> — the transliterations and the plain-English wording of the parsings are generated by this app\'s own code from the sources above. The counts of a word\'s occurrences are counted from the text of the books included in this app, and say so.</p>' +
          '<p class="small muted">In Genesis 32 the Hebrew chapter numbering runs one verse ahead of English Bibles (Hebrew 32:1 is English 31:55). Exodus has the same kind of shift in four places: Hebrew 7:26–29 is English 8:1–4 (so Hebrew chapter 8 is English 8:5–32), Hebrew 21:37 is English 22:1, and Hebrew chapter 22 is English 22:2–31. Jonah has one too: Hebrew Jonah 2:1 is English Jonah 1:17, and Hebrew chapter 2 runs one verse ahead of English Bibles through that chapter (Hebrew 2:2–11 is English 2:1–10). Affected verses are labeled with their World English Bible reference so the two never get mixed up.</p></div>';
      }

      /* Greek occurrences span the Greek books; refs are [bookId, ch, v]. */
      function greekOccSections(occAll, occ, strong) {

        ["john", "mark", "luke"].forEach(function (bid) {
          var total = occAll.filter(function (r) { return r[0] === bid; }).length;
          if (!total) return;
          var pairs = occ.filter(function (r) { return r[0] === bid; }).map(function (r) { return [r[1], r[2]]; });
          html += "<h3>Occurrences in " + BOOKMAP[bid].name + "</h3>";
          html += "<p>This dictionary word appears <strong>" + total + "</strong> time" + (total === 1 ? "" : "s") + " in the Gospel of " + BOOKMAP[bid].name + " (counted from the text in this app).</p>";
          html += '<div class="occ-list">' + occButtons(bid, pairs, strong) + "</div>";
        });
        return html;
      }
      function occButtons(bookId, refs, strong) {
        var max = 90, out = "";
        refs.slice(0, max).forEach(function (r) {
          out += '<button class="occ" data-book="' + bookId + '" data-ch="' + r[0] + '" data-v="' + r[1] + '"' + (strong ? ' data-strong="' + strong + '"' : "") + ">" + r[0] + ":" + r[1] + "</button>";
        });
        if (refs.length > max) out += '<span class="small muted">…and ' + (refs.length - max) + " more</span>";
        return out;
      }
      function wireOccButtons() {
        sheet.querySelectorAll(".occ").forEach(function (btn) {
          btn.addEventListener("click", function () {
            pendingHl = {
              book: btn.getAttribute("data-book"),
              ch: parseInt(btn.getAttribute("data-ch"), 10),
              v: parseInt(btn.getAttribute("data-v"), 10),
              strong: btn.getAttribute("data-strong") ? parseInt(btn.getAttribute("data-strong"), 10) : null
            };
            location.hash = "#/" + pendingHl.book + "/" + pendingHl.ch;
            if (current.book === pendingHl.book && current.ch === pendingHl.ch) render();
          });
        });
      }

      function greekRels(e) {
        return (e.r || []).filter(function (r) {
          var t = LEX[String(r[0])];
          return t && /[ἀ-῿Ͱ-Ͽ]/.test(t.l); /* Greek-script lemmas only */
        });
      }
      function openGreekSheet(b, ch, v, w, tokens, wi) {
        var strong = w[1], e = LEX[String(strong)];
        var occAll = greekOcc()[strong] || [];
        var occ = dedupeRefs(occAll);
        var html = '<button class="close" id="sheet-close" aria-label="Close">✕</button>';
        html += '<div class="s-ref">' + esc(b.name) + " " + ch + ":" + v + " · Greek</div>";
        html += '<div class="s-word">' + esc(w[0]) + "</div>";
        html += '<div class="s-trans">' + esc(grcTranslit(w[0])) + "</div>";
        html += hearRowHTML(w[0], "el-GR", e ? e.l : null);
        html += "<h3>Translation in this verse</h3>";
        html += '<p class="lemma-line"><strong>' + esc(grkTranslation(w, tokens, wi)) + "</strong></p>";
        html += '<p class="small muted">The English for this one word in this verse, following the original word by word — not a smooth sentence. The smooth translation is the World English Bible verse under the text. A one-word rendering cannot carry the word\'s whole meaning; the definition and synonyms below carry more of it.</p>';
        if (e) {
          if (e.d) { html += "<h3>Definition — Strong's (1890)</h3><p>" + esc(e.d) + "</p>"; }
          else if (GRK_DEF_SUPP[strong]) { html += "<h3>Definition</h3><p>" + esc(GRK_DEF_SUPP[strong]) + "</p>" + '<p class="small muted">This app\'s own wording: Strong\'s e-text leaves this entry\'s definition field empty — its explanation stands under Word origin below.</p>'; }
          html += synonymsHTML(greekSynonyms(w), greekRelated(strong, e), "Greek");
          html += "<h3>Dictionary form</h3>";
          html += '<p class="lemma-line"><strong>' + esc(e.l) + "</strong> · " + esc(e.t) + ' · <span class="muted">Strong\'s G' + strong + "</span></p>";
          html += "<h3>Parsing (Robinson's codes, spelled out)</h3>";
          var dec = w[2].split("|").map(decodeMorph);
          html += "<p>" + esc(dec[0]) + "</p>";
          for (var i = 1; i < dec.length; i++) html += '<p class="muted">Also parsed as: ' + esc(dec[i]) + "</p>";
          html += '<p class="small muted">Code in the source: ' + esc(w[2].replace(/\|/g, " / ")) + "</p>";
          if (e.o) { html += "<h3>Word origin — Strong's</h3><p>" + esc(e.o) + "</p>"; }
          if (e.g && e.g.length) {
            html += "<h3>How the King James Bible renders it (Strong's list)</h3><div class='chips'>" +
              e.g.map(function (g) { return '<span class="chip">' + esc(g) + "</span>"; }).join("") + "</div>";
            html += '<p class="small muted">The word\'s gloss — the starting point for its translation in this verse — is chosen from this list: the rendering the World English Bible uses in this verse, where one matches.</p>';
          }
        } else {
          html += '<p class="muted">No dictionary entry was found for this word in Strong\'s Greek dictionary.</p>';
        }
        html += greekOccSections(occAll, occ, strong);
        openSheet(html);
        document.getElementById("sheet-close").addEventListener("click", closeSheet);
        wireHear(w[0], "el-GR", e ? e.l : null);
        sheet.querySelectorAll("[data-rel]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var n = parseInt(btn.getAttribute("data-rel"), 10);
            openGreekLemma(n);
          });
        });
        wireOccButtons();
      }

      function openGreekLemma(strong) {
        var e = LEX[String(strong)];
        if (!e) return;
        var occAll = greekOcc()[strong] || [];
        var occ = dedupeRefs(occAll);
        var html = '<button class="close" id="sheet-close" aria-label="Close">✕</button>';
        html += '<div class="s-ref">Word study · Greek</div>';
        html += '<div class="s-word">' + esc(e.l) + "</div>";
        html += '<div class="s-trans">' + esc(e.t) + ' · Strong\'s G' + strong + "</div>";
        html += hearRowHTML(e.l, "el-GR", null);
        if (e.d) { html += "<h3>Definition — Strong's (1890)</h3><p>" + esc(e.d) + "</p>"; }
        else if (GRK_DEF_SUPP[strong]) { html += "<h3>Definition</h3><p>" + esc(GRK_DEF_SUPP[strong]) + "</p>" + '<p class="small muted">This app\'s own wording: Strong\'s e-text leaves this entry\'s definition field empty — its explanation stands under Word origin below.</p>'; }
        html += synonymsHTML(greekSynonyms([e.l, strong, "", (e.g && e.g[0]) || ""]), greekRelated(strong, e), "Greek");
        if (e.o) { html += "<h3>Word origin — Strong's</h3><p>" + esc(e.o) + "</p>"; }
        if (e.g && e.g.length) {
          html += "<h3>How the King James Bible renders it (Strong's list)</h3><div class='chips'>" +
            e.g.map(function (g) { return '<span class="chip">' + esc(g) + "</span>"; }).join("") + "</div>";
        }
        if (occ.length) {
          html += greekOccSections(occAll, occ, strong);
        } else {
          html += "<h3>Occurrences</h3>";
          html += "<p>This word does not occur in John, Mark, or Luke; it is here because Strong's dictionary connects it with a word that does.</p>";
        }
        openSheet(html);
        document.getElementById("sheet-close").addEventListener("click", closeSheet);
        wireHear(e.l, "el-GR", null);
        sheet.querySelectorAll("[data-rel]").forEach(function (btn) {
          btn.addEventListener("click", function () { openGreekLemma(parseInt(btn.getAttribute("data-rel"), 10)); });
        });
        wireOccButtons();
      }

      function openHebrewSheet(b, ch, v, w) {
        var key = hebKey(w[0]);
        var tag = hebTagFor(b.id, ch, v, w[0]);
        var occAll = hebrewOcc(b.id)[key] || [];
        var occ = dedupeRefs(occAll);
        var html = '<button class="close" id="sheet-close" aria-label="Close">✕</button>';
        html += '<div class="s-ref">' + esc(b.name) + " " + ch + ":" + v + " · Hebrew</div>";
        html += '<div class="s-word heb" dir="rtl" style="text-align:right">' + (w[1] ? "־" : "") + esc(w[0]) + "</div>";
        html += '<div class="s-trans">' + esc(hebTranslit(w[0])) + "</div>";
        var hebLemma = (tag && tag.n && LEXHEB[String(tag.n)]) ? LEXHEB[String(tag.n)].l : null;
        html += hearRowHTML(w[0], "he-IL", hebLemma);
        if (w[1]) html += "<p class='muted'>This word is joined to the word before it by a <em>maqqef</em> (the little line ־), read as one phrase.</p>";
        var htr = tag ? hebTranslation(tag, w[0]) : "";
        var he = (tag && tag.n && LEXHEB[String(tag.n)]) ? LEXHEB[String(tag.n)] : null;
        if (htr) {
          html += "<h3>Translation in this verse</h3>";
          html += '<p class="lemma-line"><strong>' + esc(htr) + "</strong></p>";
          html += '<p class="small muted">The English for this one word in this verse, following the original word by word — not a smooth sentence. The smooth translation is the World English Bible verse under the text. A one-word rendering cannot carry the word\'s whole meaning; the definition and synonyms below carry more of it.</p>';
        }
        if (he) {
          if (he.d) { html += "<h3>Definition — Strong's (1890)</h3><p>" + esc(he.d) + "</p>"; }
          if (he.b && he.b.length) {
            html += "<h3>Meaning range — Brown-Driver-Briggs (1906)</h3>";
            he.b.forEach(function (s) { html += "<p>" + esc(s) + "</p>"; });
            html += '<p class="small muted">BDB\'s sense divisions for this entry, in its own words (spelling as printed in 1906).</p>';
          }
          html += synonymsHTML(hebrewSynonyms(tag, htr), hebrewRelated(tag), "Hebrew");
        } else if (tag) {
          html += synonymsHTML(hebrewSynonyms(tag, htr), hebrewRelated(tag), "Hebrew");
        }
        if (tag && tag.s && tag.s.length) {
          html += "<h3>How this word is built</h3>";
          tag.s.forEach(function (s) { html += "<p>" + esc(s) + "</p>"; });
          if (tag.g) html += '<p class="small muted">Piece by piece, the word\'s tagging reads: ' + esc(tag.g) + "</p>";
        }
        if (he) {
          html += "<h3>Dictionary form</h3>";
          html += '<p class="lemma-line"><strong class="heb">' + esc(he.l) + "</strong> · " + esc(he.t) + ' · <span class="muted">Strong\'s H' + tag.n + "</span></p>";
          if (tag.p) { html += "<h3>Parsing</h3><p>" + esc(tag.p) + "</p>"; }
          if (he.o) { html += "<h3>Word origin — Strong's</h3><p>" + esc(he.o) + "</p>"; }
          if (he.k && he.k.length) {
            html += "<h3>How the King James Bible renders it (Strong's list)</h3><div class='chips'>" +
              he.k.map(function (g) { return '<span class="chip">' + esc(g) + "</span>"; }).join("") + "</div>";
          }
          var loccAll = hebrewLemmaOcc(b.id)[tag.n] || [];
          var locc = dedupeRefs(loccAll);
          html += "<h3>This dictionary word in " + esc(b.name) + "</h3>";
          html += "<p>Counting every form of it that this app's tagging has identified, it appears <strong>" + loccAll.length + "</strong> time" + (loccAll.length === 1 ? "" : "s") + " in " + esc(b.name) + ".</p>";
          html += '<div class="occ-list">' + occButtons(b.id, locc, tag.n) + "</div>";
        } else if (tag) {
          if (tag.p) { html += "<h3>Parsing</h3><p>" + esc(tag.p) + "</p>"; }
          if (/^Preposition/.test(tag.p || "")) {
            html += '<p class="small muted">This word is a preposition carrying its own pronoun ending (for example, לוֹ, "to him"), written as one word in Hebrew; it has no separate dictionary entry of its own.</p>';
          } else {
            html += '<p class="small muted">This word has no separate entry in Strong\'s Hebrew dictionary (1890), so it carries its gloss and parsing here without a dictionary link — rather than borrow one that does not belong to it.</p>';
          }
        } else {
          html += "<h3>About this word</h3>";
          html += '<div class="kbd-note"><p style="margin:0">This word is <strong>still being tagged</strong>. The Hebrew tagging in this app is our own work, built word by word from two public-domain lexicons — Brown-Driver-Briggs (1906) and Strong\'s Hebrew dictionary (1890) — because the ready-made Hebrew taggings are Creative Commons data, and this app is public-domain only. Rather than guess at this word\'s dictionary form, we leave the space empty until it is tagged and checked.</p></div>';
        }
        html += "<h3>This exact form in " + esc(b.name) + "</h3>";
        html += "<p>The same written form (leaving aside the accent marks, which vary with the music of the sentence) appears <strong>" + occAll.length + "</strong> time" + (occAll.length === 1 ? "" : "s") + " in " + esc(b.name) + ", counted from the text in this app.</p>";
        html += '<div class="occ-list">' + occButtons(b.id, occ, null) + "</div>";
        openSheet(html);
        document.getElementById("sheet-close").addEventListener("click", closeSheet);
        wireHear(w[0], "he-IL", hebLemma);
        wireOccButtons();
      }

      /* ================= router ================= */
      var current = { name: "home" };
      function render() {
        closeSheet(); /* any navigation — Books button included — closes an open word panel */
        var h = location.hash.replace(/^#\/?/, "");
        var parts = h.split("/").filter(Boolean);
        document.body.classList.remove("hide-tr", "hide-gl");
        if (parts.length === 0) { current = { name: "home" }; renderHome(); }
        else if (parts[0] === "sources") { current = { name: "home" }; renderHome(); var s = document.getElementById("sources"); if (s) s.scrollIntoView(); }
        else if (parts.length === 1 && BOOKMAP[parts[0]]) { current = { name: "book", book: parts[0] }; renderBook(BOOKMAP[parts[0]]); }
        else if (parts.length === 2 && BOOKMAP[parts[0]]) {
          var ch = parseInt(parts[1], 10);
          if (ch >= 1 && ch <= BOOKMAP[parts[0]].chapters.length) {
            current = { name: "chapter", book: parts[0], ch: ch };
            renderChapter(BOOKMAP[parts[0]], ch);
          } else { current = { name: "book", book: parts[0] }; renderBook(BOOKMAP[parts[0]]); }
        } else { current = { name: "home" }; renderHome(); }
      }
      window.addEventListener("hashchange", render);
      render();
    </script>
    <script data-goatcounter="https://jesuslovestyler.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
